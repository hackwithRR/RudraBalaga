    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // State Management
        const state = {
            events: [],
            rsvps: {},
            busRoutes: {},
            user: null
        };

        // Tracks the response a member had before they tapped "Change / edit my answer".
        // Used to detect re-picking the same decision (i.e. "already attending").
        // Declared at script top level so it is visible to renderEvents()/updateRsvp()
        // and ready even if renderEvents() runs synchronously from the demo-data fallback.
        const rsvpEditMode = {};

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            // Check authentication state
            firebaseAuth.onAuthStateChanged(user => {
                if (user) {
                    state.user = user;
                    loadUserData(user);
                    loadEvents();
                    loadRsvps();
                    loadBusRoutes();
                } else {
                    // No user - redirect to login
                    window.location.href = 'login.html';
                }
            });
        });

        // Load user data
        function loadUserData(user) {
            // Set Google data as fallback
            document.getElementById('user-name').textContent = user.displayName || user.email || 'ಭಕ್ತ';
            if (user.photoURL) {
                document.getElementById('profile-link').innerHTML = `<img src="${user.photoURL}" class="w-full h-full rounded-full object-cover" alt="Profile">`;
            }
            
            // Listen to user data from Firestore in real-time
            if (typeof firebaseDb !== 'undefined' && firebaseDb) {
                try {
                    firebaseDb.collection('users').doc(user.uid).onSnapshot(doc => {
                        if (doc.exists) {
                            const userData = doc.data();
                            // Update user name in header
                            document.getElementById('user-name').textContent = userData.name || user.displayName || user.email || 'ಭಕ್ತ';
                            // Show user ID
                            if (userData.userId) {
                                document.getElementById('user-id').textContent = `ಐಡಿ: ${userData.userId}`;
                                document.getElementById('user-id').classList.remove('hidden');
                            }
                            // Show profile picture in header
                            if (userData.photoURL) {
                                document.getElementById('profile-link').innerHTML = `<img src="${userData.photoURL}" class="w-full h-full rounded-full object-cover" alt="Profile">`;
                            }
                        }
                    });
                } catch (error) {
                    console.log('Firestore not available, using Google data');
                }
            }
        }

        // Load events from Firestore
        function loadEvents() {
            try {
                firebaseDb.collection('events').orderBy('date', 'desc').onSnapshot(snapshot => {
                    state.events = [];
                    snapshot.forEach(doc => {
                        state.events.push({ id: doc.id, ...doc.data() });
                    });
                    renderEvents();
                });
            } catch (error) {
                console.log('Firestore not available, using demo data');
                // Demo data
                state.events = [
                    { id: 'demo-event-1', title: 'ರುದ್ರ ಅಭಿಷೇಕಂ', date: '2026-07-15', time: '06:00', type: 'ಬೆಂಗಳೂರು', location: 'ISKCON ದೇವಸ್ಥಾನ, ಬೆಂಗಳೂರು' }
                ];
                renderEvents();
            }
        }

        // Load RSVPs from Firestore
        function loadRsvps() {
            if (!state.user) return;
            
            try {
                firebaseDb.collection('rsvps').onSnapshot(snapshot => {
                    state.rsvps = {};
                    snapshot.forEach(doc => {
                        state.rsvps[doc.id] = doc.data();
                    });
                    renderEvents();
                });
            } catch (error) {
                console.log('Firestore not available, using demo data');
                state.rsvps = {};
            }
        }

        // Load bus routes from Firestore
        function loadBusRoutes() {
            try {
                firebaseDb.collection('busRoutes').onSnapshot(snapshot => {
                    state.busRoutes = {};
                    snapshot.forEach(doc => {
                        state.busRoutes[doc.id] = doc.data().buses || [];
                    });
                    renderEvents();
                });
            } catch (error) {
                console.log('Firestore not available, using demo data');
                state.busRoutes = {};
            }
        }

        // Check if event is editable (more than 1 day before event)
        function isEventEditable(eventDate) {
            const eventDateTime = new Date(eventDate);
            const now = new Date();
            const oneDayBefore = new Date(eventDateTime);
            oneDayBefore.setDate(oneDayBefore.getDate() - 1);
            return now < oneDayBefore;
        }

        // Registration deadline (only applies to outstation events)
        function getRegistrationDeadline(e) {
            return e && e.type === 'Outstation' ? (e.registrationDeadline || null) : null;
        }

        // Registration stays open through the end of the deadline day
        function isRegistrationClosed(e) {
            const deadline = getRegistrationDeadline(e);
            if (!deadline) return false;
            const deadlineEnd = new Date(`${deadline}T23:59:59`);
            return !Number.isNaN(deadlineEnd.getTime()) && new Date() > deadlineEnd;
        }

        // Render events on events page
        function renderEvents() {
            const eventsList = document.getElementById('events-list');
            
            if (state.events.length === 0) {
                eventsList.innerHTML = '<p class="text-on-surface-variant kannada-text">ಯಾವುದೇನು ಇವೆಂಟ್ಸ್ ಕಂಡುಹಿದ್ದಲ್ಲಿಲ್ಲ.</p>';
                return;
            }

            eventsList.innerHTML = state.events.map(e => {
                const userRsvp = state.rsvps[state.user.uid] && state.rsvps[state.user.uid][e.id];
                const canEdit = isEventEditable(e.date);
                const registrationClosed = isRegistrationClosed(e);
                const registrationDeadlineText = getRegistrationDeadline(e) ? formatDate(getRegistrationDeadline(e)) : 'Not specified';
                
                // Payment info for events that require payment
                const requiresPayment = e.type === 'Outstation' && e.requiresPayment === true;
                const payStatus = (userRsvp && userRsvp.payment && userRsvp.payment.paymentStatus) || null;
                const isRejected = requiresPayment && payStatus === 'REJECTED';
                
                // Count attending users for this event (users whose payment was rejected don't count)
                let attendingCount = 0;
                Object.entries(state.rsvps).forEach(([uid, rsvpData]) => {
                    if (rsvpData[e.id] && rsvpData[e.id].status === 'attending' && rsvpData[e.id].payment?.paymentStatus !== 'REJECTED') {
                        attendingCount++;
                    }
                });
                
                // Check if limit is reached
                const isLimitReached = e.limit && attendingCount >= e.limit;
                
                // Determine status display
                let status, statusColor;
                if (isRejected) {
                    status = 'Payment rejected by admin - please respond again';
                    statusColor = 'text-error font-bold';
                } else if (userRsvp && userRsvp.status === 'attending' && userRsvp.payment?.paymentStatus === 'PENDING_APPROVAL') {
                    status = 'Payment proof pending approval';
                    statusColor = 'text-amber-700';
                } else if (userRsvp && userRsvp.status === 'attending' && userRsvp.payment?.paymentStatus === 'APPROVED') {
                    status = 'Paid - attending';
                    statusColor = 'text-green-700';
                } else if (userRsvp && userRsvp.status === 'not-attending') {
                    status = 'ಹಾಜರಾಗಿಲ್ಲ';
                    statusColor = 'text-error';
                } else if (userRsvp && userRsvp.status === 'attending' && requiresPayment) {
                    status = 'Attending - payment not completed';
                    statusColor = 'text-amber-700';
                } else if (userRsvp) {
                    status = userRsvp.status === 'attending' ? 'ಹಾಜರಾಗಿದ್ದೀರಿ' : 'ಹಾಜರಾಗಿಲ್ಲ';
                    statusColor = userRsvp.status === 'attending' ? 'text-secondary' : 'text-error';
                } else if (registrationClosed) {
                    status = 'Last date to register is over';
                    statusColor = 'text-error font-bold';
                } else if (isLimitReached) {
                    status = 'ಇವೆಂಟ್ ಸಮಾಪ್ತಿಯಾಗಿದೆ';
                    statusColor = 'text-error';
                } else {
                    status = 'ಪ್ರತಿಕ್ರಿಯೆ ಇಲ್ಲ';
                    statusColor = 'text-on-surface-variant';
                }
                
                // Paid / Not-paid badge for events that require payment
                let paymentBadgeHtml = '';
                if (requiresPayment) {
                    let badgeLabel, badgeClasses, badgeIcon;
                    if (payStatus === 'APPROVED') { badgeLabel = 'Paid'; badgeClasses = 'bg-green-100 text-green-800 border-green-300'; badgeIcon = 'verified'; }
                    else if (payStatus === 'PENDING_APPROVAL') { badgeLabel = 'Under review'; badgeClasses = 'bg-amber-100 text-amber-800 border-amber-300'; badgeIcon = 'hourglass_top'; }
                    else if (payStatus === 'REJECTED') { badgeLabel = 'Payment rejected'; badgeClasses = 'bg-red-100 text-red-700 border-red-300'; badgeIcon = 'cancel'; }
                    else { badgeLabel = `₹${Number(e.amount || 0)} - Not paid`; badgeClasses = 'bg-surface-container-high text-on-surface-variant border-outline-variant'; badgeIcon = 'currency_rupee'; }
                    paymentBadgeHtml = `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full border text-xs font-bold ${badgeClasses}"><span class="material-symbols-outlined" style="font-size:14px;">${badgeIcon}</span><span>${badgeLabel}</span></span>`;
                }
                
                // Get bus routes for outstation events - only show selected pickup point
                let busRoutesHtml = '';
                if (e.type === 'Outstation' && userRsvp && userRsvp.status === 'attending' && userRsvp.pickupPoint) {
                    const buses = state.busRoutes[e.id] || [];
                    const allRoutes = [];
                    buses.forEach(bus => {
                        if (bus.routes) {
                            bus.routes.forEach(route => {
                                allRoutes.push({ ...route, busName: bus.name, busNumber: bus.number || '', driverNumber: bus.driverNumber || '' });
                            });
                        }
                    });
                    
                    // Find the selected pickup point
                    const selectedRoute = allRoutes.find(route => route.id === userRsvp.pickupPoint);
                    
                    if (selectedRoute) {
                        busRoutesHtml = `
                            <div class="mt-3 pt-3 border-t border-outline-variant">
                                <p class="font-label-lg text-label-lg text-on-surface-variant mb-2 kannada-text">ನಿಮ್ಮ ಬಸ್ ಪಿಕಪ್ ಪಾಯಿಂಟ್:</p>
                                <div class="p-3 rounded-lg border-2 border-primary-container bg-primary-fixed-dim">
                                    <p class="font-body-lg text-body-lg text-on-surface kannada-text">${selectedRoute.point}</p>
                                    <p class="font-label-md text-label-md text-on-surface-variant">${selectedRoute.time} (${selectedRoute.busName})</p>
                                    <div class="mt-2 pt-2 border-t border-outline-variant">
                                        <p class="font-label-md text-label-md text-on-surface-variant kannada-text"><span class="material-symbols-outlined text-secondary" style="font-size:16px;vertical-align:middle;">directions_bus</span> ಬಸ್ ಸಂಖ್ಯೆ: <span class="font-bold text-on-surface">${selectedRoute.busNumber || 'ಘೋಷಿಸಲಾಗುವುದು'}</span></p>
                                        <p class="font-label-md text-label-md text-on-surface-variant kannada-text mt-1"><span class="material-symbols-outlined text-secondary" style="font-size:16px;vertical-align:middle;">call</span> ಡ್ರೈವರ್ ದೂರವಾಣಿ: ${selectedRoute.driverNumber ? `<a href="tel:${selectedRoute.driverNumber.replace(/[^+0-9]/g, '')}" class="font-bold text-primary underline">${selectedRoute.driverNumber}</a>` : '<span>ಘೋಷಿಸಲಾಗುವುದು</span>'}</p>
                                    </div>
                                </div>
                                <p class="text-xs text-on-surface-variant mt-2 italic kannada-text">ಪಿಕಪ್ ಪಾಯಿಂಟ್ ಆಯ್ಕೆ ಮಾಡಲ್ಪಟ್ಟಿದೆ. <a href="bus-routes.html" class="text-primary font-bold kannada-text">ಬಸ್ ರೌಟ್ಸ್‌ನಲ್ಲಿ ಬದಲಿಸಿ</a></p>
                            </div>
                        `;
                    }
                }
                
                // Build RSVP buttons or limit reached message
                const registrationClosedHtml = `<div class="mt-3 p-3 bg-error-container rounded-lg text-center"><p class="font-body-lg text-body-lg text-on-error-container font-bold kannada-text">Last date to register is over</p><p class="text-sm text-on-error-container mt-1 kannada-text">Registration closed on ${registrationDeadlineText}.</p></div>`;
                const notAttendingOnlyHtml = `<div class="mt-2 grid grid-cols-1 gap-2"><button class="edit-rsvp-btn touch-active w-full bg-surface-container-highest text-on-surface-variant font-bold py-2 rounded-lg text-sm" data-event-id="${e.id}" data-status="not-attending"><span class="kannada-text">ಹಾಜರಾಗಿಲ್ಲ</span></button></div>`;
                let rsvpButtonsHtml = '';
                if (isRejected) {
                    // Admin rejected the payment - reset the RSVP and ask again whether attending or not
                    rsvpButtonsHtml = `
                            <div class="mt-3 p-3 bg-error-container rounded-lg border border-error/30">
                                <p class="font-bold text-on-error-container flex items-center gap-2 kannada-text"><span class="material-symbols-outlined">cancel</span>ನಿಮ್ಮ ಪಾವತಿಯನ್ನು ಅಡ್ಮಿನ್ ತಿರಸ್ಕರಿಸಿದ್ದಾರೆ</p>
                                <p class="text-sm text-on-error-container mt-1 kannada-text">ನಿಮ್ಮ ಉತ್ತರವನ್ನು ಮರುಹೊಂದಿಸಲಾಗಿದೆ. ದಯವಿಟ್ಟು ಮತ್ತೊಮ್ಮೆ ಆಯ್ಕೆ ಮಾಡಿ - ಹಾಜರಾಗುತ್ತೀರಿ ಎಂದರೆ ಹೊಸ ಪಾವತಿ ಸಲ್ಲಿಸಬೇಕಾಗುತ್ತದೆ.</p>
                            </div>
                            ${canEdit ? (registrationClosed ? `${registrationClosedHtml}${notAttendingOnlyHtml}` : `
                            <div class="mt-2 grid grid-cols-2 gap-2">
                                <button class="edit-rsvp-btn touch-active w-full bg-primary-container text-on-primary-container font-bold py-2 rounded-lg text-sm" data-event-id="${e.id}" data-status="attending"><span class="kannada-text">ಹಾಜರಾಗಿದ್ದೀರಿ</span></button>
                                <button class="edit-rsvp-btn touch-active w-full bg-surface-container-highest text-on-surface-variant font-bold py-2 rounded-lg text-sm" data-event-id="${e.id}" data-status="not-attending"><span class="kannada-text">ಹಾಜರಾಗಿಲ್ಲ</span></button>
                            </div>`) : ''}
                    `;
                } else if (userRsvp) {
                    // User has already responded
                    if (registrationClosed && canEdit && userRsvp.status === 'attending') {
                        // Registration is over - attending members can only cancel their attendance
                        rsvpButtonsHtml = `${registrationClosedHtml}${notAttendingOnlyHtml}`;
                    } else if (canEdit && !registrationClosed) {
                        if (rsvpEditMode[e.id] !== undefined) {
                            // User tapped "Change my answer" - show the two options again while
                            // keeping their previous response so picking the same one is detected.
                            rsvpButtonsHtml = `
                            <div class="mt-3 grid grid-cols-2 gap-2">
                                <button class="edit-rsvp-btn touch-active w-full bg-primary-container text-on-primary-container font-bold py-2 rounded-lg text-sm" data-event-id="${e.id}" data-status="attending"><span class="kannada-text">ಹಾಜರಾಗಿದ್ದೀರಿ</span></button>
                                <button class="edit-rsvp-btn touch-active w-full bg-surface-container-highest text-on-surface-variant font-bold py-2 rounded-lg text-sm" data-event-id="${e.id}" data-status="not-attending"><span class="kannada-text">ಹಾಜರಾಗಿಲ್ಲ</span></button>
                            </div>
                        `;
                        } else {
                            rsvpButtonsHtml = `
                            <div class="mt-3 grid grid-cols-1 gap-2">
                                <button class="edit-rsvp-btn touch-active w-full bg-secondary-container text-on-secondary-container font-bold py-2 rounded-lg text-sm" data-event-id="${e.id}" data-status="edit">
                                    <span class="material-symbols-outlined mr-1" data-icon="edit" style="font-variation-settings: 'FILL' 1;">edit</span>
                                    <span class="kannada-text">ನನ್ನ ಉತ್ತರವನ್ನು ಬದಲಿಸಿ</span>
                                </button>
                            </div>
                        `;
                        }
                    }
                } else if (registrationClosed) {
                    // No response yet and registration is over
                    rsvpButtonsHtml = registrationClosedHtml;
                } else if (isLimitReached) {
                    // Limit reached - show message instead of buttons
                    rsvpButtonsHtml = `
                        <div class="mt-3 p-3 bg-error-container rounded-lg text-center">
                            <p class="font-body-lg text-body-lg text-on-error-container font-bold kannada-text">ಇವೆಂಟ್ ಸಮಾಪ್ತಿಯಾಗಿದೆ</p>
                            <p class="font-body-lg text-body-lg text-on-error-container mt-1 kannada-text">ಈ ಇವೆಂಟ್‌ನ ಗರಿಷ್ಠ ಸಂಖ್ಯೆ ${e.limit} ಗಳಷ್ಟು ಸಮಾಪ್ತಿಯಾಗಿದೆ.</p>
                        </div>
                    `;
                } else if (canEdit) {
                    // User hasn't responded and limit not reached - show buttons
                    rsvpButtonsHtml = `
                        <div class="mt-3 grid grid-cols-2 gap-2">
                            <button class="edit-rsvp-btn touch-active w-full bg-primary-container text-on-primary-container font-bold py-2 rounded-lg text-sm" data-event-id="${e.id}" data-status="attending"><span class="kannada-text">ಹಾಜರಾಗಿದ್ದೀರಿ</span></button>
                            <button class="edit-rsvp-btn touch-active w-full bg-surface-container-highest text-on-surface-variant font-bold py-2 rounded-lg text-sm" data-event-id="${e.id}" data-status="not-attending"><span class="kannada-text">ಹಾಜರಾಗಿಲ್ಲ</span></button>
                        </div>
                    `;
                }
                
                return `
                    <div class="bg-surface-container-lowest border-2 border-primary-container rounded-xl p-6 shadow-sm" data-event-id="${e.id}">
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-2">
                            <h4 class="font-bold text-primary text-lg kannada-text">${e.title}</h4>
                            ${paymentBadgeHtml}
                        </div>
                        <p class="text-on-surface font-body-lg text-body-lg kannada-text">${e.type === 'Outstation' && e.eventEndDate ? `${formatDate(e.date)} - ${formatDate(e.eventEndDate)}` : formatDate(e.date)} ರಂದು ${e.time} ಗಂಟೆಗೆ</p>
                        <p class="text-on-surface-variant font-body-lg text-body-lg kannada-text">${e.type === 'Outstation' ? 'ಔಟ್ಸ್ಟೇಷನ್' : 'ಬೆಂಗಳೂರು'} - ${e.location}</p>
                        ${e.type === 'Outstation' ? (() => {
                            const outstationDates = Array.isArray(e.outstationDates) ? e.outstationDates : [];
                            const rangeDates = [e.departureDate, e.returnDate, ...outstationDates].filter(Boolean);
                            const visibleRange = rangeDates.length ? `${formatDate(rangeDates[0])} - ${formatDate(rangeDates[rangeDates.length - 1])}` : '';
                            const eventRange = e.eventEndDate ? `${formatDate(e.date)} - ${formatDate(e.eventEndDate)}` : formatDate(e.date);
                            const eventEndDate = e.eventEndDate ? formatDate(e.eventEndDate) : 'Not specified';

                            return visibleRange ? `
                                <div class="mt-2 p-3 bg-secondary-fixed rounded-lg border-2 border-secondary-container">
                                    <p class="font-label-lg text-label-lg text-secondary mb-1 kannada-text">ಔಟ್ಸ್ಟೇಷನ್ ಇವೆಂಟ್ ತಾರೆಗಳು</p>
                                    <p class="font-body-lg text-body-lg text-on-surface kannada-text">${eventRange}</p>
                                    <p class="font-label-md text-label-md text-secondary mt-2 kannada-text">Event end date</p>
                                    <p class="font-body-lg text-body-lg text-on-surface kannada-text">${eventEndDate}</p>
                                    <p class="font-label-md text-label-md text-secondary mt-2 kannada-text">ನಿರ್ಗಮನದಿಂದ ಬೆಂಗಳೂರು ಆಗಮನದವರೆಗೆ</p>
                                    <p class="font-body-lg text-body-lg text-on-surface kannada-text">${visibleRange}</p>
                                    <p class="font-label-md text-label-md text-secondary mt-2 kannada-text">Last date to register</p>
                                    <p class="font-body-lg text-body-lg ${registrationClosed ? 'text-error font-bold' : 'text-on-surface'} kannada-text">${registrationDeadlineText}</p>
                                    ${registrationClosed ? '<p class="font-label-md text-label-md text-error mt-1 kannada-text">Registration is over</p>' : ''}
                                </div>
                            ` : '';
                        })() : ''}
                        ${e.limit ? `<p class="text-on-surface-variant font-label-md text-label-md mt-1 kannada-text">ಮಿತಿ: ${e.limit} | ಹಾಜರಾಗಿದ್ದವರು: ${attendingCount}</p>` : ''}
                        <div class="mt-3 pt-3 border-t border-outline-variant">
                            <p class="font-label-lg text-label-lg text-on-surface-variant kannada-text">ನಿಮ್ಮ ಪ್ರತಿಕ್ರಿಯೆ:</p>
                            <p class="font-body-lg text-body-lg ${statusColor} kannada-text">${status}</p>
                            ${rsvpButtonsHtml}
                        </div>
                        ${busRoutesHtml}
                    </div>
                `;
            }).join('');

            // Add event listeners for edit buttons
            document.querySelectorAll('.edit-rsvp-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const eventId = this.getAttribute('data-event-id');
                    const status = this.getAttribute('data-status');
                    updateRsvp(eventId, status);
                });
            });
            
            // Add event listeners for bus pickup radio buttons
            document.querySelectorAll('.bus-pickup-radio').forEach(radio => {
                radio.addEventListener('change', function() {
                    const eventId = this.getAttribute('data-event-id');
                    const pickupPoint = this.value;
                    updatePickupPoint(eventId, pickupPoint);
                });
            });
        }
        
        // Show a toast notification
        function showEventsToast(message, isInfo) {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 left-0 right-0 mx-auto z-50 px-6 py-4 rounded-xl shadow-lg max-w-sm ${isInfo ? 'bg-surface-container-high text-on-surface-variant' : 'bg-primary-container text-on-primary-container'}`;
            toast.innerHTML = `
                <div class="flex items-center justify-center gap-3 font-body-lg text-body-lg">
                    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">${isInfo ? 'info' : 'check_circle'}</span>
                    <span class="kannada-text">${message}</span>
                </div>
            `;
            document.body.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.parentNode.removeChild(toast);
            }, 3000);
        }

        // Update pickup point
        function updatePickupPoint(eventId, pickupPoint) {
            if (!state.user) return;
            
            const rsvpData = {
                ...state.rsvps[state.user.uid]?.[eventId],
                pickupPoint: pickupPoint
            };
            
            firebaseDb.collection('rsvps').doc(state.user.uid).set({
                [eventId]: rsvpData
            }, { merge: true });
        }

        // Update RSVP on events page
        function updateRsvp(eventId, status) {
            if (!state.user) return;

            // Handle "edit" status - keep the previous response but show the options again.
            // We remember the prior status so that re-picking the same option is detected.
            if (status === 'edit') {
                const prevStatus = (state.rsvps[state.user.uid] && state.rsvps[state.user.uid][eventId] && state.rsvps[state.user.uid][eventId].status) || null;
                rsvpEditMode[eventId] = prevStatus;
                // Re-render to show the buttons
                renderEvents();
                return;
            }

            // Find the event
            const event = state.events.find(e => e.id === eventId);

            // Already in the requested state - tell the user instead of re-saving/re-paying
            if (rsvpEditMode[eventId] !== undefined && status === rsvpEditMode[eventId]) {
                showEventsToast(status === 'attending' ? 'ನೀವು ಈಗಾಗಲೇ ಹಾಜರಾಗಿದ್ದೀರಿ.' : 'ನೀವು ಈಗಾಗಲೇ ಹಾಜರಾಗಿಲ್ಲ ಎಂದು ಆಯ್ಕೆ ಮಾಡಿದ್ದೀರಿ.', true);
                delete rsvpEditMode[eventId];
                renderEvents();
                return;
            }

            // Do not accept registrations after the last date to register
            if (status === 'attending' && event && isRegistrationClosed(event)) {
                alert(`Last date to register for this event was ${formatDate(event.registrationDeadline)}. Registration is now over.`);
                return;
            }

            // Outstation events require payment. If the member has already paid (payment was
            // not rejected), don't ask them to pay again when they switch back to attending.
            if (status === 'attending' && event && event.type === 'Outstation' && event.requiresPayment === true) {
                const currentRsvp = state.rsvps[state.user.uid] && state.rsvps[state.user.uid][eventId];
                const payStatus = currentRsvp && currentRsvp.payment && currentRsvp.payment.paymentStatus;
                const alreadyPaid = payStatus && payStatus !== 'REJECTED';
                if (!alreadyPaid) {
                    showPaymentModal(event);
                    return;
                }
            }
            
            // Check if event has a limit and if it's reached (only for attending status)
            if (status === 'attending' && event && event.limit) {
                // Count current attending members (rejected payments don't count)
                let attendingCount = 0;
                Object.entries(state.rsvps).forEach(([uid, rsvpData]) => {
                    if (rsvpData[eventId] && rsvpData[eventId].status === 'attending' && rsvpData[eventId].payment?.paymentStatus !== 'REJECTED') {
                        attendingCount++;
                    }
                });
                
                if (attendingCount >= event.limit) {
                    // Show limit reached alert
                    alert(`ಕ್ಷಮಿಸಿ, ಈ ಇವೆಂಟ್‌ನ ಗರಿಷ್ಠ ಸಂಖ್ಯೆ ${event.limit} ಗಳಷ್ಟು ಸಮಾಪ್ತಿಯಾಗಿದೆ.`);
                    return;
                }
            }

            const rsvpData = {
                ...state.rsvps[state.user.uid]?.[eventId],
                status: status
            };

            // Keep the payment record when switching to not-attending so an already-paid member
            // does not have to re-pay if they later switch back to attending. Only a rejected
            // payment is dropped (a fresh one is required for the booking).
            if (status === 'not-attending' && rsvpData.payment && rsvpData.payment.paymentStatus === 'REJECTED') {
                delete rsvpData.payment;
            }

            // Leaving edit mode - show the normal status view after saving.
            if (rsvpEditMode[eventId] !== undefined) {
                delete rsvpEditMode[eventId];
            }

            if (!state.rsvps[state.user.uid]) state.rsvps[state.user.uid] = {};
            state.rsvps[state.user.uid][eventId] = rsvpData;
            renderEvents();

            firebaseDb.collection('rsvps').doc(state.user.uid).set({
                [eventId]: rsvpData
            }, { merge: true }).then(() => {
                // Show toast notification
                showEventsToast(status === 'attending' ? 'ನೀವು ಹಾಜರಾಗಿದ್ದೀರಿ!' : 'ನೀವು ಹಾಜರಾಗಿಲ್ಲ.', false);
            });
        }

        function showPaymentModal(event) {
            const amount = Number(event.amount || 0).toFixed(2);
            const upiId = event.upiId || window.paymentConfig?.upiId || 'YOUR_UPI_ID@bank';
            const upiLabel = ((window.paymentConfig?.upiIds || []).find((option) => option.id === upiId) || {}).label || 'UPI';
            const appName = window.paymentConfig?.appName || 'Rudra Balaga';
            const upiUrl = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(appName)}&am=${encodeURIComponent(amount)}&cu=INR&tn=${encodeURIComponent(`EVENT_${event.id}_${state.user.uid}`)}`;
            const bankTransfer = event.bankTransfer || {};
            const bankTransferHtml = bankTransfer.accountNumber ? `
                        <div class="rounded-xl bg-surface-container-high border border-outline-variant overflow-hidden">
                            <button type="button" id="toggle-bank-details" class="w-full flex items-center justify-between gap-2 px-4 py-3 text-left">
                                <span class="flex items-center gap-2 font-label-lg text-label-lg text-primary"><span class="material-symbols-outlined">account_balance</span>Pay by bank transfer</span>
                                <span id="bank-details-chevron" class="material-symbols-outlined text-on-surface-variant transition-transform">expand_more</span>
                            </button>
                            <div id="bank-details-body" class="hidden px-4 pb-4 space-y-1 text-sm text-on-surface-variant">
                                <p>Bank: <strong class="text-on-surface">${bankTransfer.bankName || 'Not specified'}</strong></p>
                                <p>Account holder: <strong class="text-on-surface">${bankTransfer.accountName || 'Not specified'}</strong></p>
                                <p class="break-all">Account number: <strong class="text-on-surface select-all">${bankTransfer.accountNumber}</strong></p>
                                <p>IFSC: <strong class="text-on-surface select-all">${bankTransfer.ifscCode || 'Not specified'}</strong></p>
                            </div>
                        </div>` : '';
            const modal = document.createElement('div');
            modal.className = 'payment-modal-backdrop fixed inset-0 z-50 flex items-center justify-center';
            modal.innerHTML = `
                <div class="payment-modal bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-full">
                    <div class="payment-modal-header flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="payment-method-icon material-symbols-outlined">payments</span>
                            <div class="min-w-0">
                                <h3 class="font-headline-sm text-headline-sm text-primary leading-tight">Outstation payment</h3>
                                <p class="text-sm text-on-surface-variant truncate">${event.title}</p>
                            </div>
                        </div>
                        <button id="close-payment-modal" aria-label="Close" class="shrink-0 w-9 h-9 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center text-xl leading-none">&times;</button>
                    </div>
                    <div class="payment-modal-body space-y-3 sm:space-y-4">
                        <div class="rounded-xl bg-secondary-fixed border border-secondary-container p-4 text-center sm:text-left">
                            <p class="font-label-md text-label-md text-secondary uppercase tracking-wider">Amount to pay</p>
                            <p class="text-3xl sm:text-4xl font-bold text-primary mt-1">&#8377;${amount}</p>
                            <p class="text-on-surface-variant text-sm mt-1">${event.paymentDescription || 'Outstation event fee'}</p>
                        </div>
                        ${bankTransferHtml}
                        <div class="payment-disclaimer p-3 text-sm">
                            <span class="material-symbols-outlined shrink-0" style="font-size:18px;">info</span>
                            <p><strong>Important:</strong> Payment is non-refundable if you change your decision or cancel later.</p>
                        </div>
                        <div>
                            <p class="payment-step-label font-label-lg text-label-lg text-on-surface mb-2"><span class="payment-step-num">1</span>Choose a payment method</p>
                            <div class="grid grid-cols-1 min-[420px]:grid-cols-2 gap-2.5">
                                <button type="button" id="cancel-payment-modal" class="touch-active h-14 rounded-xl bg-surface-container-high text-on-surface-variant font-bold flex items-center justify-center gap-2">
                                    <span class="material-symbols-outlined">arrow_back</span>No, go back
                                </button>
                                <a href="${upiUrl}" class="touch-active h-14 rounded-xl bg-primary-container text-on-primary-container font-bold flex items-center justify-center gap-2">
                                    <span class="material-symbols-outlined">account_balance_wallet</span>Pay via GPay / UPI
                                </a>
                            </div>
                            <p class="text-xs text-on-surface-variant mt-2 text-center sm:text-left break-all">Paying to: <strong class="text-on-surface">${upiLabel} &middot; ${upiId}</strong></p>
                        </div>
                        <form id="payment-proof-form" class="space-y-3 pt-4 border-t border-outline-variant">
                            <p class="payment-step-label font-label-lg text-label-lg text-on-surface"><span class="payment-step-num">2</span>Submit your payment proof</p>
                            <div>
                                <label for="payment-screenshot" class="block font-label-md text-label-md text-on-surface mb-1.5">Transaction screenshot <span class="text-error">*</span></label>
                                <input id="payment-screenshot" type="file" accept="image/*" required class="w-full px-3 py-2.5 rounded-xl border border-outline-variant text-on-surface bg-white">
                            </div>
                            <div>
                                <label for="payment-utr" class="block font-label-md text-label-md text-on-surface mb-1.5">UTR / Transaction reference</label>
                                <input id="payment-utr" type="text" inputmode="numeric" class="w-full h-12 px-3 rounded-xl border border-outline-variant text-on-surface bg-white" placeholder="Recommended">
                            </div>
                            <button type="submit" class="touch-active w-full h-14 rounded-xl bg-secondary-container text-on-secondary-container font-bold flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined">upload_file</span>Submit payment proof
                            </button>
                            <p id="payment-upload-status" class="text-sm text-on-surface-variant"></p>
                        </form>
                    </div>
                </div>`;
            document.body.appendChild(modal);
            // Close when tapping the backdrop
            modal.addEventListener('click', (clickEvent) => {
                if (clickEvent.target === modal) modal.remove();
            });
            // Toggle collapsible bank details
            const toggleBankBtn = document.getElementById('toggle-bank-details');
            if (toggleBankBtn) {
                toggleBankBtn.onclick = () => {
                    document.getElementById('bank-details-body')?.classList.toggle('hidden');
                    const chevron = document.getElementById('bank-details-chevron');
                    if (chevron) chevron.style.transform = chevron.style.transform === 'rotate(180deg)' ? '' : 'rotate(180deg)';
                };
            }
            document.getElementById('close-payment-modal').onclick = () => modal.remove();
            document.getElementById('cancel-payment-modal').onclick = () => modal.remove();
            document.getElementById('payment-proof-form').addEventListener('submit', async (submitEvent) => {
                submitEvent.preventDefault();
                const file = document.getElementById('payment-screenshot').files[0];
                const uploadStatus = document.getElementById('payment-upload-status');
                uploadStatus.textContent = 'Uploading payment proof...';
                try {
                    if (!file) throw new Error('Payment screenshot is required.');
                    const screenshotBase64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                    const payment = { paymentStatus: 'PENDING_APPROVAL', amount: Number(event.amount), paymentDescription: event.paymentDescription || '', screenshotBase64, utrNumber: document.getElementById('payment-utr').value.trim(), submittedAt: firebase.firestore.FieldValue.serverTimestamp() };
                    await firebaseDb.collection('rsvps').doc(state.user.uid).set({ [event.id]: { ...(state.rsvps[state.user.uid]?.[event.id] || {}), status: 'attending', payment } }, { merge: true });
                    modal.remove();
                    renderEvents();
                } catch (error) {
                    console.error('Payment proof upload failed:', error);
                    uploadStatus.textContent = 'Upload failed. Please try again.';
                }
            });
        }

        // Show help modal
        function showHelpModal() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-xl p-6 w-full max-w-lg">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-headline-sm text-headline-sm text-primary kannada-text">ಸಹಾಯ ಮತ್ತು ಬೆಂಬಲ</h3>
                        <button id="close-help-modal" class="text-2xl text-on-surface-variant">&times;</button>
                    </div>
                    <div class="space-y-4">
                        <div class="p-4 bg-surface-container-high rounded-lg">
                            <h4 class="font-bold text-primary mb-2 kannada-text">ಸಹಾಯ ಬೇಕೇ?</h4>
                            <p class="text-on-surface font-body-lg text-body-lg kannada-text">ದಯವಿಟ್ಟು ನಿಮಗೆ ಸಹಾಯ ಬೇಕಾದರೆ ಅಡ್ಮಿನ್ ಅವರನ್ನು ಸಂಪರ್ಕಿಸಿ:</p>
                            <ul class="list-disc list-inside text-on-surface font-body-lg text-body-lg mt-2 space-y-1 kannada-text">
                                <li>ಇವೆಂಟ್ ನೇಮಣಿಸುವಿಕೆಗಳು</li>
                                <li>ಬಸ್ ಪಿಕಪ್ ಪಾಯಿಂಟ್ ಆಯ್ಕೆನ್</li>
                                <li>ಖಾತ್ರಾ ಅಥವಾ ಪ್ರೊಫೈಲ್ ಸಮಸ್ಯಾಲ್</li>
                                <li>ತೆಕ್ನಿಕಲ್ ಸಹಾಯ</li>
                            </ul>
                        </div>
                        <div id="admins-list" class="space-y-2">
                            <p class="text-center text-on-surface-variant kannada-text">ಅಡ್ಮಿನ್ಸ್ ಲೋಡ್ ಆಗುತ್ತಿದ್ದಾರೆ...</p>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('close-help-modal').addEventListener('click', () => {
                document.body.removeChild(modal);
            });
            
            // Fetch admin users from Firestore
            if (typeof firebaseDb !== 'undefined' && firebaseDb) {
                try {
                    firebaseDb.collection('users').where('role', '==', 'admin').onSnapshot(snapshot => {
                        const adminsList = document.getElementById('admins-list');
                        if (snapshot.empty) {
                            adminsList.innerHTML = '<p class="text-center text-on-surface-variant kannada-text">ಯಾವ ಅಡ್ಮಿನ್ ಲಭ್ಯವಿಲ್ಲ</p>';
                            return;
                        }
                        
                        let html = '<p class="font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ಅಡ್ಮಿನ್ ಸಂಪರ್ಕಿಸಿ:</p>';
                        snapshot.forEach(doc => {
                            const admin = doc.data();
                            const phone = admin.phone || admin.email || 'N/A';
                            const name = admin.name || 'ಅಡ್ಮಿನ್';
                            html += `
                                <div class="p-3 bg-primary-fixed rounded-lg flex justify-between items-center">
                                    <span class="font-body-lg text-body-lg text-on-primary-fixed kannada-text">${name}</span>
                                    <a href="tel:${phone}" class="text-primary font-bold text-body-lg kannada-text">${phone}</a>
                                </div>
                            `;
                        });
                        adminsList.innerHTML = html;
                    });
                } catch (error) {
                    document.getElementById('admins-list').innerHTML = '<p class="text-center text-on-surface-variant kannada-text">ಅಡ್ಮಿನ್ ಸಂಪರ್ಕವನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ</p>';
                }
            }
        }
        
        // Add help button click handler
        document.getElementById('help-btn').addEventListener('click', showHelpModal);

        // Format date for display
        function formatDate(dateString) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('kn-IN', options);
        }
    </script>
</body>
</html>
