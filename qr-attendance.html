<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Attendance · Rudra Balaga</title>
    <link rel="icon" href="om.ico">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { background: #fdf8f3; font-family: system-ui, sans-serif; }
        #qr-reader video, #qr-reader canvas { border-radius: 0.75rem; width: 100% !important; object-fit: cover; display: block; }
        #qr-reader img { display: none !important; }
        #qr-reader__dashboard, #qr-reader__status_span, #qr-reader__dashboard_section_csr, #qr-reader__dashboard_section_swaplink { display: none !important; }
        .scan-wrap { position: relative; }
        .scan-overlay { position: absolute; inset: 10%; pointer-events: none; display: none; }
        .scan-overlay.active { display: block; }
        .scan-corner { position: absolute; width: 30px; height: 30px; border: 4px solid #fff; opacity: .95; filter: drop-shadow(0 0 4px rgba(0,0,0,.6)); }
        .scan-corner.tl { top: 0; left: 0; border-right: none; border-bottom: none; border-top-left-radius: 14px; }
        .scan-corner.tr { top: 0; right: 0; border-left: none; border-bottom: none; border-top-right-radius: 14px; }
        .scan-corner.bl { bottom: 0; left: 0; border-right: none; border-top: none; border-bottom-left-radius: 14px; }
        .scan-corner.br { bottom: 0; right: 0; border-left: none; border-top: none; border-bottom-right-radius: 14px; }
        .scan-laser { position: absolute; left: 4%; right: 4%; top: 0; height: 3px; border-radius: 3px;
            background: linear-gradient(90deg, transparent, #d500f9 30%, #7c4dff 50%, #d500f9 70%, transparent);
            box-shadow: 0 0 12px 3px rgba(124,77,255,.55);
            animation: laser 2.2s cubic-bezier(.4,0,.6,1) infinite; }
        @keyframes laser { 0% { top: 4%; } 50% { top: 92%; } 100% { top: 4%; } }
        .live-dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; display: inline-block; animation: blink 1s ease-in-out infinite; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
        .celebrate-overlay { position: fixed; inset: 0; z-index: 60; background: rgba(20,10,30,.72); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center; padding: 1.5rem; animation: fadeIn .25s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .celebrate-card { background: #fff; border-radius: 1.5rem; max-width: 22rem; width: 100%; text-align: center; padding: 2rem 1.5rem 1.75rem;
            box-shadow: 0 24px 60px rgba(0,0,0,.35); animation: popIn .45s cubic-bezier(.2,1.4,.4,1); position: relative; overflow: hidden; }
        @keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .celebrate-card h2 { color: #e65100; font-size: 1.4rem; font-weight: 800; }
        .celebrate-card .evt { color: #f57c00; font-weight: 800; }
        .celebrate-card p { color: #57504a; font-size: .95rem; margin-top: .5rem; }
        .check-wrap { width: 96px; height: 96px; margin: 0 auto 1rem; border-radius: 50%; background: linear-gradient(135deg,#ef6c00,#ff9800);
            display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(239,108,0,.45); animation: checkPop .5s cubic-bezier(.2,1.6,.4,1); }
        @keyframes checkPop { from { transform: scale(0); } 60% { transform: scale(1.15); } to { transform: scale(1); } }
        .check-svg { width: 52px; height: 52px; }
        .check-path { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
            stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .5s .25s ease forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .confetti { position: absolute; top: -12px; width: 9px; height: 14px; opacity: 0; animation: confetti 1.8s ease-in forwards; border-radius: 2px; }
        @keyframes confetti { 0% { transform: translateY(0) rotate(0); opacity: 1; } 100% { transform: translateY(340px) rotate(540deg); opacity: 0; } }
        .celebrate-btn { margin-top: 1.25rem; width: 100%; height: 52px; border-radius: .8rem; font-weight: 800; color: #fff;
            background: linear-gradient(135deg,#ef6c00,#ff9800); box-shadow: 0 6px 18px rgba(239,108,0,.4); }
    </style>
</head>
<body class="min-h-screen">
    <main class="max-w-md mx-auto px-4 py-6 pb-24 space-y-4">
        <div class="flex items-center gap-3">
            <a href="index" class="w-11 h-11 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface" aria-label="Back to home">
                <span class="material-symbols-outlined">arrow_back</span>
            </a>
            <h1 class="text-2xl font-bold text-primary">QR Attendance</h1>
        </div>

        <section id="status-panel" class="bg-surface-container-lowest border-2 border-primary-container rounded-xl p-6 shadow-sm text-center">
            <p id="status-text" class="text-on-surface-variant font-body-lg text-body-lg">Loading…</p>
        </section>

        <section id="scanner-panel" class="hidden bg-surface-container-lowest border-2 border-primary-container rounded-xl p-6 shadow-sm">
            <h2 class="font-bold text-primary mb-2 flex items-center gap-2">
                <span class="material-symbols-outlined">qr_code_scanner</span>Scan Event QR
            </h2>
            <p class="text-on-surface-variant text-sm mb-3">Point your camera at the attendance QR code displayed by the admin.</p>
            <div class="scan-wrap hidden" id="scan-wrap">
                <video id="camera-view" playsinline autoplay muted class="w-full rounded-xl mb-3"></video>
                <div id="scan-overlay" class="scan-overlay">
                    <div class="scan-corner tl"></div><div class="scan-corner tr"></div>
                    <div class="scan-corner bl"></div><div class="scan-corner br"></div>
                    <div class="scan-laser"></div>
                </div>
            </div>
            <div id="qr-reader" class="hidden"></div>
            <p id="scan-state" class="hidden text-center text-sm text-on-surface-variant mb-3"><span class="live-dot"></span> <span id="scan-state-text">Scanning…</span></p>
            <button id="start-scan-btn" class="w-full h-14 bg-primary-container text-on-primary-container rounded-xl font-bold text-body-lg flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">photo_camera</span>Start Camera Scanner
            </button>
            <button id="torch-btn" class="hidden w-full h-12 mt-3 bg-surface-container-high text-on-surface rounded-xl font-bold text-body-lg flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">flashlight_on</span>Toggle Flash
            </button>
        </section>

        <p class="text-center text-on-surface-variant text-xs">Rudra Balaga · ರುದ್ರ ಪರಾಯಣ</p>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const statusText = document.getElementById('status-text');
        const scannerPanel = document.getElementById('scanner-panel');
        let processedEvents = {}; // guard against duplicate marking in one session
        let pendingEventId = null;
        let listenersBound = false;
        const log = (...args) => console.log('[QR Attendance]', ...args);

        function setStatus(html, tone) {
            const tones = { info: 'text-on-surface-variant', success: 'text-green-700 font-bold', error: 'text-red-700 font-bold' };
            statusText.className = `${tones[tone] || tones.info} font-body-lg text-body-lg`;
            statusText.innerHTML = html;
        }

        function showToast(html, ok) {
            const toast = document.createElement('div');
            toast.className = `fixed top-20 left-0 right-0 mx-auto z-50 px-6 py-4 rounded-xl shadow-lg max-w-sm ${ok ? 'bg-primary-container text-on-primary-container' : 'bg-error-container text-on-error-container'}`;
            toast.innerHTML = html;
            document.body.appendChild(toast);
            setTimeout(() => { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 3500);
        }

        // Accepts the scanned/opened payload and extracts the event id.
        function extractEventId(raw) {
            if (!raw) return null;
            const text = String(raw).trim();
            let m = text.match(/[?&]e=([^&\s]+)/);
            if (m) return decodeURIComponent(m[1]);
            m = text.match(/RUDRA_ATTEND:([\w-]+)/i);
            if (m) return m[1];
            if (/^[\w-]{8,}$/.test(text)) return text; // bare Firestore id
            return null;
        }

        function showSuccessPopup(eventTitle, alreadyMarked) {
            const old = document.querySelector('.celebrate-overlay');
            if (old) old.remove();
            const overlay = document.createElement('div');
            overlay.className = 'celebrate-overlay';
            const colors = ['#ff9800', '#ffb300', '#f57c00', '#ff6d00', '#40c4ff', '#66bb6a'];
            let confetti = '';
            for (let i = 0; i < 26; i++) {
                confetti += `<span class="confetti" style="left:${Math.random() * 100}%;background:${colors[i % colors.length]};animation-delay:${(Math.random() * 0.6).toFixed(2)}s;animation-duration:${(1.4 + Math.random() * 1.2).toFixed(2)}s;"></span>`;
            }
            overlay.innerHTML = `
                <div class="celebrate-card">
                    ${confetti}
                    <div class="check-wrap"><svg class="check-svg" viewBox="0 0 52 52"><path class="check-path" d="M14 27 L23 36 L38 17"/></svg></div>
                    <h2>${alreadyMarked ? 'Already marked!' : 'Attendance marked!'}</h2>
                    <p>You are marked <span class="evt">attended</span> for<br><span class="evt">${eventTitle}</span></p>
                    <p style="font-size:.85rem;color:#93887f;">🙏 ಧನ್ಯವಾದಗಳು · See you at the event!</p>
                    <button class="celebrate-btn" type="button">Done</button>
                </div>`;
            document.body.appendChild(overlay);
            overlay.querySelector('.celebrate-btn').addEventListener('click', () => overlay.remove());
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
            setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 6000);
        }
        async function markAttendance(eventId, uid) {
            if (processedEvents[eventId]) return;
            processedEvents[eventId] = true;
            setStatus('Marking your attendance…', 'info');
            try {
                const eventSnap = await firebaseDb.collection('events').doc(eventId).get();
                if (!eventSnap.exists) {
                    setStatus('Invalid QR code — this event does not exist.', 'error');
                    showToast('<span>Invalid QR code</span>', false);
                    return;
                }
                const eventTitle = eventSnap.data().title || 'this event';
                const rsvpRef = firebaseDb.collection('rsvps').doc(uid);
                const rsvpSnap = await rsvpRef.get();
                const existing = (rsvpSnap.exists && rsvpSnap.data()[eventId]) || {};

                if (existing.status === 'attended') {
                    setStatus(`You are already marked <strong>attended</strong> for <strong>${eventTitle}</strong>`, 'success');
                    showSuccessPopup(eventTitle, true);
                    return;
                }

                // Mark attended — merged so pickupPoint / payment details are preserved.
                await rsvpRef.set({
                    [eventId]: {
                        status: 'attended',
                        pickupPoint: existing.pickupPoint || null,
                        qrAttendance: true,
                        qrAttendanceAt: new Date().toISOString()
                    }
                }, { merge: true });

                // Append to the shared attendance log used by the admin roster export.
                const userDoc = await firebaseDb.collection('users').doc(uid).get();
                const name = (userDoc.exists && (userDoc.data().name || userDoc.data().email)) || 'Unknown';
                await firebaseDb.collection('attendance').doc(`event-${eventId}`).set({
                    eventId,
                    eventTitle,
                    presentUids: firebase.firestore.FieldValue.arrayUnion(uid),
                    present: firebase.firestore.FieldValue.arrayUnion(name),
                    qrMarked: firebase.firestore.FieldValue.arrayUnion(uid),
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                setStatus(`Attendance marked! You are <strong>attended</strong> for <strong>${eventTitle}</strong>`, 'success');
                showSuccessPopup(eventTitle, false);
            } catch (err) {
                processedEvents[eventId] = false;
                console.error('[QR Attendance] marking error:', err);
                setStatus('Something went wrong while marking attendance. Please try again.', 'error');
            }
        }

        function handleScannedText(rawText) {
            log('decoded:', rawText);
            const eventId = extractEventId(rawText);
            if (!eventId) {
                showToast('<span>Not a valid attendance QR</span>', false);
                return;
            }
            stopScanner();
            if (window.firebaseAuth.currentUser) {
                markAttendance(eventId, window.firebaseAuth.currentUser.uid);
            } else {
                setStatus('Please wait — signing you in…', 'info');
                pendingEventId = eventId;
            }
        }
        // ================= Scanner (live camera only, dual engine) =================
        // Engine 1: native BarcodeDetector (Chrome/Android — most reliable, zero library deps)
        // Engine 2: html5-qrcode fallback (iOS Safari and older browsers)
        let stream = null;
        let detector = null;
        let detectTimer = null;
        let hintTimer = null;
        let engine = null; // 'native' | 'h5q'
        let html5QrCode = null;
        let scanDone = false;
        let torchOn = false;

        function setScanStateText(text) {
            const stateEl = document.getElementById('scan-state');
            if (text) { stateEl.classList.remove('hidden'); document.getElementById('scan-state-text').textContent = text; }
            else stateEl.classList.add('hidden');
        }

        function showScanningUi() {
            document.getElementById('start-scan-btn').classList.add('hidden');
            document.getElementById('torch-btn').classList.remove('hidden');
        }

        function stopScanner() {
            scanDone = true;
            document.getElementById('scan-overlay').classList.remove('active');
            setScanStateText(null);
            document.getElementById('torch-btn').classList.add('hidden');
            if (detectTimer) { clearInterval(detectTimer); detectTimer = null; }
            if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
            if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
            if (html5QrCode && engine === 'h5q') {
                try { html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {}); } catch (e) {}
            }
            engine = null;
        }

        function cameraErrorMsg(err) {
            const name = (err && (err.name || err.type)) || '';
            log('camera error:', name, err && err.message);
            if (/NotAllowedError|PermissionDenied|SecurityError/i.test(name)) {
                return 'Camera permission was denied. Allow camera access for this site in your browser settings (tap the lock icon in the address bar → Permissions → Camera → Allow), then tap Start again.';
            }
            if (/NotFoundError|DevicesNotFound|OverconstrainedError/i.test(name)) {
                return 'No usable camera was found on this device.';
            }
            if (/NotReadableError|TrackStart/i.test(name)) {
                return 'The camera is in use by another app. Close it and tap Start again.';
            }
            if (!window.isSecureContext) {
                return 'Camera requires a secure connection. Open the app over HTTPS (e.g. ' + location.host + ').';
            }
            return 'Could not start the camera (' + (name || 'unknown error') + '). Please try again.';
        }

        async function startNativeScanner() {
            stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
                audio: false
            });
            const video = document.getElementById('camera-view');
            video.srcObject = stream;
            await new Promise((resolve) => {
                if (video.readyState >= 2) return resolve();
                video.onloadedmetadata = () => resolve();
                setTimeout(resolve, 3000); // don't hang forever
            });
            await video.play().catch(() => {});

            let formats = null;
            try { formats = await window.BarcodeDetector.getSupportedFormats(); } catch (e) {}
            detector = new window.BarcodeDetector(formats && formats.includes('qr_code') ? { formats: ['qr_code'] } : undefined);

            document.getElementById('scan-wrap').classList.remove('hidden');
            document.getElementById('scan-overlay').classList.add('active');
            document.getElementById('start-scan-btn').classList.add('hidden');
            document.getElementById('torch-btn').classList.remove('hidden');
            setScanStateText('Scanning… (camera live)');
            engine = 'native';
            log('native engine started');

            hintTimer = setTimeout(() => {
                if (!scanDone && engine === 'native') {
                    setScanStateText('Still scanning — hold steady, move closer, or toggle the flash');
                }
            }, 12000);

            detectTimer = setInterval(async () => {
                if (scanDone || !stream) { if (detectTimer) clearInterval(detectTimer); return; }
                try {
                    const codes = await detector.detect(video);
                    if (codes && codes.length) {
                        scanDone = true;
                        handleScannedText(codes[0].rawValue);
                    }
                } catch (e) { /* transient per-frame errors are normal */ }
            }, 300);
        }

        async function startHtml5Scanner() {
            if (typeof Html5Qrcode === 'undefined') throw new Error('h5q-unavailable');
            html5QrCode = new Html5Qrcode('qr-reader', { verbose: false });
            const config = {
                fps: 10,
                qrbox: { width: 220, height: 220 },
                aspectRatio: 1.0,
                experimentalFeatures: { useBarCodeDetectorIfSupported: true }
            };
            await html5QrCode.start({ facingMode: 'environment' }, config, (decodedText) => {
                if (scanDone) return;
                scanDone = true;
                handleScannedText(decodedText);
            }, () => {});
            document.getElementById('qr-reader').classList.remove('hidden');
            document.getElementById('start-scan-btn').classList.add('hidden');
            document.getElementById('torch-btn').classList.remove('hidden');
            setScanStateText('Scanning… (camera live)');
            engine = 'h5q';
            log('html5-qrcode engine started');
            hintTimer = setTimeout(() => {
                if (!scanDone && engine === 'h5q') {
                    setScanStateText('Still scanning — hold steady, move closer, or toggle the flash');
                }
            }, 12000);
        }

        async function startScanner() {
            if (engine) return; // already running
            scanDone = false;
            const startBtn = document.getElementById('start-scan-btn');
            startBtn.disabled = true;
            setStatus('Requesting camera…', 'info');
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('getUserMedia unsupported — open the app in Chrome / Safari over HTTPS.');
                }
                if ('BarcodeDetector' in window) {
                    try {
                        await startNativeScanner();
                    } catch (nativeErr) {
                        log('native engine failed, trying fallback:', nativeErr);
                        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
                        await startHtml5Scanner();
                    }
                } else {
                    await startHtml5Scanner();
                }
                setStatus('Camera is live — aim at the QR code.', 'info');
            } catch (err) {
                log('scanner failed:', err);
                stopScanner();
                setStatus(cameraErrorMsg(err), 'error');
            } finally {
                startBtn.disabled = false;
                if (!engine) startBtn.classList.remove('hidden'); // allow retry on failure
            }
        }

        function setupTorch() {
            document.getElementById('torch-btn').addEventListener('click', async () => {
                try {
                    if (engine === 'native' && stream) {
                        const track = stream.getVideoTracks()[0];
                        const caps = track.getCapabilities ? track.getCapabilities() : {};
                        if (caps.torch) {
                            torchOn = !torchOn;
                            await track.applyConstraints({ advanced: [{ torch: torchOn }] });
                        } else showToast('<span>Flash not supported on this camera</span>', false);
                    } else if (engine === 'h5q' && html5QrCode) {
                        const caps = html5QrCode.getRunningTrackCapabilities();
                        if (caps && caps.torch) {
                            torchOn = !torchOn;
                            await html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchOn }] });
                        } else showToast('<span>Flash not supported on this camera</span>', false);
                    }
                } catch (e) {
                    showToast('<span>Flash not supported on this camera</span>', false);
                }
            });
        }

        // ================= Boot =================
        firebase.auth().onAuthStateChanged(async (user) => {
            log('auth state:', user ? user.uid : 'signed out');
            const deepLinkEventId = extractEventId(location.href);

            if (!user) {
                setStatus(`Please <a href="login" class="text-primary underline font-bold">log in</a> first, then scan the event QR code to mark your attendance.`, 'info');
                return;
            }

            if (deepLinkEventId) {
                await markAttendance(deepLinkEventId, user.uid);
            } else {
                setStatus('Tap the button below and scan the event QR to mark your attendance.', 'info');
            }

            scannerPanel.classList.remove('hidden');
            if (!listenersBound) {
                listenersBound = true;
                document.getElementById('start-scan-btn').addEventListener('click', startScanner);
                setupTorch();
            }

            if (pendingEventId) {
                const id = pendingEventId;
                pendingEventId = null;
                markAttendance(id, user.uid);
            }
        });
    </script>
</body>
</html>
