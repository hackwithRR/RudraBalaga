    <style>
        body {
            background-color: #fbf9f8;
            color: #1b1c1c;
            -webkit-tap-highlight-color: transparent;
        }

        }

        /* --- Responsive payment (donation) modal --- */
        .payment-modal-backdrop { background: rgba(36, 27, 22, 0.68) !important; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); overscroll-behavior: contain; padding: 0.75rem; }
        @media (min-width: 480px) { .payment-modal-backdrop { padding: 1.25rem; } }
        .payment-modal { border: 1px solid #e7d9ce; border-radius: 1.25rem !important; box-shadow: 0 28px 80px rgba(36, 27, 22, 0.28); max-height: calc(100vh - 1.5rem); }
        @supports (height: 100dvh) { .payment-modal { max-height: calc(100dvh - 1.5rem); } }
        .payment-modal::-webkit-scrollbar { width: 6px; }
        .payment-modal::-webkit-scrollbar-thumb { background: #dbc2b0; border-radius: 999px; }
        .payment-modal-header { position: sticky; top: 0; z-index: 10; background: rgba(255, 255, 255, 0.96); backdrop-filter: blur(6px); padding: 1rem 1.25rem 0.85rem; border-bottom: 1px solid #e7d9ce; }
        @media (min-width: 480px) { .payment-modal-header { padding: 1.25rem 1.5rem 1rem; } }
        .payment-modal-body { padding: 1rem 1.25rem 1.25rem; overflow-y: auto; }
        @media (min-width: 480px) { .payment-modal-body { padding: 1.25rem 1.5rem 1.5rem; } }
        .payment-method-icon { display: inline-flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem; border-radius: 0.7rem; background: #ffe8cc; color: #8f4e00; flex-shrink: 0; }
        .payment-disclaimer { display: flex; gap: 0.65rem; align-items: flex-start; border: 1px solid #ebcf99; border-radius: 0.75rem; background: #fff8e8; color: #765315; }
        .payment-modal input[type='file'] { padding-top: 0.7rem; font-size: 0.9rem; width: 100%; }
        .payment-modal input[type='text'], .payment-modal input[type='number'] { font-size: 16px; }
        .payment-step-label { display: inline-flex; align-items: center; gap: 0.5rem; }
        .payment-step-num { display: inline-flex; align-items: center; justify-content: center; width: 1.35rem; height: 1.35rem; border-radius: 999px; background: #8f4e00; color: #ffffff; font-size: 0.72rem; font-weight: 700; flex-shrink: 0; }

<body class="font-body-md text-body-md pb-32">

    <!-- Premium Light Preloader Screen -->
    <div id="loader-panel" class="fixed inset-0 z-[9999] flex flex-col justify-between p-6 bg-[#ffffff]">
        
        <!-- Top Status Bar -->
        <div class="w-full flex justify-between items-center text-[9px] tracking-[0.4em] font-bold text-stone-400 pt-4">
            <div>SACRED ALIGNMENT // GEN V</div>
            <div id="load-state" class="text-right text-[#ff5722]">AUM NAMAH SHIVAYA</div>
        </div>

        <!-- Central Iconic Frame -->
        <div class="flex-1 flex flex-col items-center justify-center relative">
            
            <!-- Shockwave Ring -->
            <div id="shockwave" class="absolute w-12 h-12 rounded-full border border-[#ff5722] opacity-0 scale-50 pointer-events-none"></div>

            <!-- Foreground Graphic Canvas Layout -->
            <div class="w-80 h-80 relative flex items-center justify-center z-20">
                
                <!-- Master Vector SVG Geometry -->
                <svg id="shiva-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="w-full h-full relative z-20">
                    
                    <!-- Rotating Orange Halo -->
                    <g id="rotating-halo" class="orange-glow">
                        <circle cx="200" cy="180" r="120" fill="none" stroke="#ff5722" stroke-width="1" stroke-dasharray="8 4" opacity="0.3">
                            <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 200 180" to="360 200 180" dur="20s" repeatCount="indefinite"/>
                        </circle>
                        <circle cx="200" cy="180" r="130" fill="none" stroke="#ff5722" stroke-width="0.5" opacity="0.2">
                            <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="360 200 180" to="0 200 180" dur="25s" repeatCount="indefinite"/>
                        </circle>
                    </g>
                    
                    <!-- Cosmic Background Framework Rings -->
                    <circle cx="200" cy="180" r="150" fill="none" stroke="#f3f3f2" stroke-width="1" />
                    <circle cx="200" cy="180" r="144" fill="none" stroke="#e9e9e7" stroke-width="1" stroke-dasharray="4 8" />

                    <!-- Trishul Layer -->
                    <g id="final-trishul" fill="none" stroke="#ff5722" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-0 orange-glow">
                        <!-- ── TRISHUL HEAD (top) ── -->
                        <!-- Center prong: leaf blade -->
                        <path d="M 200,8 C 193.5,19 192.5,36 197,54 L 203,54 C 207.5,36 206.5,19 200,8 Z" fill="#ff5722" stroke="none" />
                        <path d="M 200,16 C 197,26 196.5,40 198.5,50" stroke="#ffffff" stroke-width="1" opacity="0.5" />
                        <!-- Left prong -->
                        <path d="M 197,58 C 185.5,55 177,47 175.5,36" stroke-width="3" />
                        <path d="M 175.5,10 C 169.5,19 168.5,32 173,44 L 182,41 C 183,30 181,19 175.5,10 Z" fill="#ff5722" stroke="none" />
                        <path d="M 176,17 C 172.5,25 172.5,34 174.5,41" stroke="#ffffff" stroke-width="0.9" opacity="0.45" />
                        <!-- Right prong: mirrored -->
                        <path d="M 203,58 C 214.5,55 223,47 224.5,36" stroke-width="3" />
                        <path d="M 224.5,10 C 230.5,19 231.5,32 227,44 L 218,41 C 217,30 219,19 224.5,10 Z" fill="#ff5722" stroke="none" />
                        <path d="M 224,17 C 227.5,25 227.5,34 225.5,41" stroke="#ffffff" stroke-width="0.9" opacity="0.45" />
                        <!-- Crescent crossguard -->
                        <path d="M 184,54 C 191,62 209,62 216,54 L 211,62 C 205,69 195,69 189,62 Z" fill="#ff5722" stroke="none" />
                        <!-- Short shaft stub (stops well above damaru) -->
                        <line x1="200" y1="66" x2="200" y2="70" stroke-width="4" />
                        <!-- ── GAP ── -->
                        <!-- ── DAMARU (middle: above the shivling, below the trishul head) ── -->
                        <path d="M 182,76 C 193,80.5 198,85 198,89 C 198,93 193,97.5 182,102 L 218,102 C 207,97.5 202,93 202,89 C 202,85 207,80.5 218,76 Z" fill="#ff5722" stroke="none" />
                        <ellipse cx="182" cy="76" rx="4.5" ry="2.2" fill="#ff5722" stroke="none" />
                        <ellipse cx="218" cy="76" rx="4.5" ry="2.2" fill="#ff5722" stroke="none" />
                        <ellipse cx="182" cy="102" rx="4.5" ry="2.2" fill="#ff5722" stroke="none" />
                        <ellipse cx="218" cy="102" rx="4.5" ry="2.2" fill="#ff5722" stroke="none" />
                        <path d="M 184,77.5 Q 197.5,83 197.5,89 Q 197.5,95 184,100.5" stroke="#ffffff" stroke-width="1" opacity="0.45" fill="none" />
                        <path d="M 216,77.5 Q 202.5,83 202.5,89 Q 202.5,95 216,100.5" stroke="#ffffff" stroke-width="1" opacity="0.45" fill="none" />
                        <!-- Damaru string beads -->
                        <circle cx="178.5" cy="79.5" r="1.5" fill="#ff5722" stroke="none" />
                        <circle cx="221.5" cy="79.5" r="1.5" fill="#ff5722" stroke="none" />
                        <circle cx="178.5" cy="98.5" r="1.5" fill="#ff5722" stroke="none" />
                        <circle cx="221.5" cy="98.5" r="1.5" fill="#ff5722" stroke="none" />
                    </g>

                    <!-- Shivling Layer -->
                    <g fill="none" stroke="#292524" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path id="draw-lingam" class="neon-line" d="M 160,185 C 160,105 240,105 240,185 Z" />
                        <path id="draw-yoni-top" class="neon-line" d="M 120,185 L 280,185 C 295,185 300,195 300,200 C 300,205 290,205 280,205 L 120,205 C 110,205 100,205 100,200 C 100,195 105,185 120,185 Z" />
                        <path id="draw-base-tier" class="neon-line" d="M 145,205 L 255,205 L 255,225 L 145,225 Z" />
                        <path id="draw-pedestal" class="neon-line" d="M 125,225 L 275,225 L 265,245 L 135,245 Z" />
                    </g>
                    
                    <!-- Tripundra Lines -->
                    <g fill="none" stroke="#ff5722" stroke-width="3" stroke-linecap="round" class="orange-glow">
                        <line id="line1" x1="185" y1="140" x2="215" y2="140" class="neon-line" />
                        <line id="line2" x1="181" y1="147" x2="219" y2="147" class="neon-line" />
                        <line id="line3" x1="185" y1="154" x2="215" y2="154" class="neon-line" />
                        <circle id="bindu" cx="200" cy="147" r="2.5" fill="#ff5722" class="opacity-0"/>
                    </g>
                </svg>
            </div>
            
        <!-- App Branding Typography -->
        <div class="overflow-visible text-center mt-6">
            <h1 id="app-title" class="text-3xl font-black text-stone-900 opacity-0 translate-y-[100%]">
                ರುದ್ರ <span class="text-[#ff5722] orange-glow">ಬಳಗ</span>
            </h1>
        </div>
        </div>

        <!-- Bottom Loading Tracker Bar -->
        <div class="w-full flex flex-col items-center justify-center pb-6 gap-2">
            <div class="w-16 h-[1px] bg-stone-200 relative overflow-hidden">
                <div id="bar-meter" class="absolute inset-y-0 left-0 w-0 bg-[#ff5722] shadow-[0_0_8px_#ff5722]"></div>

            <span class="text-[8px] tracking-[0.3em] font-bold text-stone-400 uppercase">ASCENDING TO LIGHT</span>
        </div>

    <!-- TopAppBar -->
    <header class="bg-surface-container-lowest border-b-2 border-primary-container w-full fixed top-0 z-50">
        <div class="flex justify-between items-center px-4 h-16">
            <div class="flex items-center gap-3">
                <img alt="Rudra Balaga Logo" class="w-8 h-8 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCGlnKErrgX-hzStznZ9vHCbMO-wVdNUUB3BTexOf5cFdjznQoHJY__pyT9Z7YSc9QEjbDynAwZQ7ehGJrgyYzkzcVi3uuprj1veErdmPgZj0OW8Uq1XlwPAYXul0e1T7ykM7CUsM7Ohmmhys1X_0lQqpNC4U5i5qbmXCrFzECcx0b4RZ_60tpfYZTuKIVDVUXZ0zW6Wg0uQ6B_w4g2shyIkDuOdJe0QxIxARUjpBlGqypF6ggy6KDPXh_PmzeXmBTgOAB01hg8jNDV"/>
                <h1 class="text-xl font-bold text-primary">ರುದ್ರ ಬಳಗ</h1>
            </div>
            <a href="index.html" class="touch-active flex items-center justify-center w-12 h-12 rounded-full bg-primary-container">
                <span class="material-symbols-outlined text-on-primary-container" data-icon="close">close</span>

        </div>

    <!-- Main Canvas -->
    <main id="app-content" class="pt-20 px-margin-mobile space-y-stack-lg max-w-2xl mx-auto opacity-0">
        <!-- Profile Header -->
        <section class="mt-stack-md text-center">
            <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary kannada-text">ನನ್ನ ಪ್ರೊಫೈಲ್</h2>
        </section>

        <!-- Profile Card -->
        <section>
            <div class="bg-surface-container-lowest border-2 border-primary-container rounded-xl p-6 shadow-sm">
                <!-- Profile Form -->
                <form id="profile-form" class="space-y-4">
                    <div class="flex flex-col items-center mb-4">
                        <div class="w-24 h-24 rounded-full bg-primary-container flex items-center justify-center mb-3 overflow-hidden" id="profile-preview">
                            <span class="material-symbols-outlined text-primary text-4xl" data-icon="person" style="font-variation-settings: 'FILL' 1;">person</span>
                        </div>
                        <input type="file" id="profile-pic-input" accept="image/*" class="hidden">
                        <button type="button" id="change-pic-btn" class="touch-active text-primary font-label-lg text-label-lg kannada-text">ಫೋಟೋ ಬದಲಿಸಿ</button>
                    </div>
                    <div>
                        <label for="profile-name" class="block font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ಪೂರ್ಣ ಹೆಸರು</label>
                        <input type="text" id="profile-name" class="w-full h-[60px] px-4 rounded-xl border-2 border-stone-300 bg-white text-on-surface font-body-lg kannada-text" placeholder="ನಿಮ್ಮ ಹೆಸರನ್ನು ನಮೂದಿಸಿ">
                    </div>
                    <div>
                        <label for="profile-email" class="block font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ಇಮೇಲ್</label>
                        <input type="email" id="profile-email" disabled class="w-full h-[60px] px-4 rounded-xl border-2 border-stone-300 bg-surface-container-high text-on-surface-variant font-body-lg kannada-text">
                    </div>
                    <div>
                        <label for="profile-phone" class="block font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ಫೋನ್ ನಂಬರ್</label>
                        <input type="tel" id="profile-phone" class="w-full h-[60px] px-4 rounded-xl border-2 border-stone-300 bg-white text-on-surface font-body-lg kannada-text" placeholder="+91XXXXXXXXXX">
                    </div>
                    <div>
                        <label for="profile-dob" class="block font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ಜನ್ಮ ತಾರೆ</label>
                        <input type="date" id="profile-dob" class="w-full h-[60px] px-4 rounded-xl border-2 border-stone-300 bg-white text-on-surface font-body-lg kannada-text">
                    </div>
                    <div>
                        <label for="profile-address" class="block font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ವಿಳಾಸ</label>
                        <textarea id="profile-address" rows="3" class="w-full h-[100px] px-4 py-3 rounded-xl border-2 border-stone-300 bg-white text-on-surface font-body-lg kannada-text" placeholder="ನಿಮ್ಮ ವಿಳಾಸವನ್ನು ನಮೂದಿಸಿ"></textarea>
                    </div>
                    <div class="pt-4 border-t border-outline-variant">
                        <h3 class="font-headline-sm text-headline-sm text-primary mb-3 kannada-text">ತುರ್ತು ಸಂಪರ್ಕ ವಿವರಗಳು</h3>
                        <div class="space-y-3">
                            <div>
                                <label for="profile-emergency-name" class="block font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ತುರ್ತು ಸಂಪರ್ಕ ವ್ಯಕ್ತಿಯ ಹೆಸರು</label>
                                <input type="text" id="profile-emergency-name" class="w-full h-[60px] px-4 rounded-xl border-2 border-stone-300 bg-white text-on-surface font-body-lg kannada-text" placeholder="ಹೆಸರು">
                            </div>
                            <div>
                                <label for="profile-emergency-contact" class="block font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ತುರ್ತು ಸಂಪರ್ಕ ಫೋನ್ ನಂಬರ್</label>
                                <input type="tel" id="profile-emergency-contact" class="w-full h-[60px] px-4 rounded-xl border-2 border-stone-300 bg-white text-on-surface font-body-lg kannada-text" placeholder="+91XXXXXXXXXX">
                            </div>
                            <div>
                                <label for="profile-emergency-relation" class="block font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ಸಂಬಂಧ</label>
                                <input type="text" id="profile-emergency-relation" class="w-full h-[60px] px-4 rounded-xl border-2 border-stone-300 bg-white text-on-surface font-body-lg kannada-text" placeholder="ಉದಾ: Father, Mother, Spouse">
                            </div>
                        </div>

                    <button type="submit" class="w-full h-[60px] bg-primary-container text-on-primary-container font-bold py-5 rounded-xl shadow-md flex items-center justify-center gap-2 h-16 text-body-lg kannada-text">

                        ಪ್ರೊಫೈಲ್ ಸೇವ್ ಮಾಡಿ
                    </button>

            <button id="logout-btn" class="w-full h-[60px] bg-error text-on-error font-bold py-5 rounded-xl shadow-md flex items-center justify-center gap-2 h-16 text-body-lg kannada-text">
                <span class="material-symbols-outlined" data-icon="logout" style="font-variation-settings: 'FILL' 1;">logout</span>
                ಲಾಗ್ ಔಟ್
            </button>
        </section>
    </main>

    <!-- Help Button (Floating) -->
    <button id="help-btn" class="fixed bottom-32 right-4 z-40 flex items-center justify-center gap-2 w-auto h-14 px-4 rounded-full bg-secondary-container text-on-secondary-container shadow-lg touch-active">
        <span class="material-symbols-outlined" data-icon="help" style="font-variation-settings: 'FILL' 1;">help</span>
        <span class="font-label-lg text-label-lg">ಸಹಾಯ</span>
    </button>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="notifications.js"></script>
    <script src="pwa.js"></script>
    <script>
        // State
        const state = {
            user: null,
            userData: null
        };

        // Loading animation
        const tl = gsap.timeline();

        // 1. Text activation
        tl.to("#app-title", { opacity: 1, translateY: 0, duration: 1, ease: "power4.out" })
          
          // 2. Stroke layout drawing orchestration
          .to(".neon-line", {
              strokeDashoffset: 0,
              duration: 3.2,
              ease: "power2.inOut",
              stagger: 0.08,
              onUpdate: function() {
                  let progress = Math.floor(this.progress() * 100);
                  document.getElementById("bar-meter").style.width = progress + "%";
                  
                  if(progress > 20 && progress < 65) {
                      document.getElementById("load-state").textContent = "MANIFESTING DIVINE MATRIX";
                  } else if(progress >= 65) {
                      document.getElementById("load-state").textContent = "LOCKING AXIAL RADIALS";
                  }
              }
          }, "-=0.8");
        
        // 3. Mount centered backplane graphics
        tl.to("#final-trishul", {
            opacity: 1,
            duration: 0.5,
            ease: "power2.out",
            onStart: () => {
                document.getElementById("load-state").textContent = "TRISHUL MOUNTED";
            }
        }, "-=0.4")
        .to("#bindu", {
            opacity: 1,
            scale: 1,
            duration: 0.3,
            ease: "back.out(3)"
        }, "-=0.2");

        // 4. Force emission pulses
        tl.to("#shockwave", {
            opacity: 0.6,
            scale: 18,
            duration: 0.8,
            ease: "expo.out"
        })
        .to("#shiva-svg", {
            scale: 0.96,
            duration: 0.15
        }, "-=0.8");

        // 5. Unveil core product view shell
        tl.to("#loader-panel", {
            clipPath: "polygon(0% 0%, 100% 0%, 100% 0%, 0% 0%)",
            duration: 1.3,
            ease: "expo.inOut"
        })
        .to("#app-content", {
            opacity: 1,
            scale: 1,
            duration: 1.2,
            ease: "power3.out",
            onComplete: () => {
                document.getElementById("app-content").style.pointerEvents = "auto";
                document.getElementById("loader-panel").remove();
                initializeApp();
            }
        }, "-=1.0");

        // Initialize app
        function initializeApp() {
            // Check authentication state - STRICTLY require login
            firebaseAuth.onAuthStateChanged(user => {
                if (user) {
                    state.user = user;
                    // Real-time notification center (bell + badge + panel + toasts)
                    if (window.Notifications) { try { Notifications.init({ uid: user.uid }); } catch (e) {} }
                    // Listen to user data from Firestore in real-time
                    try {
                        firebaseDb.collection('users').doc(user.uid).onSnapshot(doc => {
                            if (doc.exists) {
                                state.userData = doc.data();
                                loadProfileData();
                            } else {
                                // User document doesn't exist yet
                                loadProfileData();
                            }
                        });
                    } catch (error) {
                        // If Firestore fails, use Google data
                        loadProfileData();
                    }
                } else {
                    // Redirect to login if not authenticated
                    window.location.href = 'login.html';
                }
            });
        }

        // Load profile data
        function loadProfileData() {
            // Pre-fill from Google user data
            if (state.user) {
                document.getElementById('profile-name').value = state.userData?.name || state.user.displayName || '';
                document.getElementById('profile-email').value = state.user.email || '';
            }
            // Load additional data from Firestore
            if (state.userData) {
                document.getElementById('profile-phone').value = state.userData.phone || '';
                document.getElementById('profile-dob').value = state.userData.dob || '';
                document.getElementById('profile-address').value = state.userData.address || '';
                document.getElementById('profile-emergency-name').value = state.userData.emergencyContactName || '';
                document.getElementById('profile-emergency-contact').value = state.userData.emergencyContact || '';
                document.getElementById('profile-emergency-relation').value = state.userData.emergencyContactRelation || '';
                // Load profile picture
                if (state.userData.photoURL) {
                    document.getElementById('profile-preview').innerHTML = `<img src="${state.userData.photoURL}" class="w-full h-full object-cover" alt="Profile">`;
                }
            }
        }

        // Setup form submit
        document.getElementById('profile-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const profileData = {
                name: document.getElementById('profile-name').value,
                phone: document.getElementById('profile-phone').value,
                dob: document.getElementById('profile-dob').value,
                address: document.getElementById('profile-address').value,
                emergencyContactName: document.getElementById('profile-emergency-name').value,
                emergencyContact: document.getElementById('profile-emergency-contact').value,
                emergencyContactRelation: document.getElementById('profile-emergency-relation').value
            };
            
            if (state.user) {
                firebaseDb.collection('users').doc(state.user.uid).set({
                    ...state.userData,
                    ...profileData
                }, { merge: true }).then(() => {
                    alert('Profile saved successfully!');
                });
            }
        });

        // Setup profile picture change
        document.getElementById('change-pic-btn').addEventListener('click', function() {
            document.getElementById('profile-pic-input').click();
        });

        document.getElementById('profile-pic-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64 = event.target.result;
                    // Update preview
                    document.getElementById('profile-preview').innerHTML = `<img src="${base64}" class="w-full h-full object-cover" alt="Profile">`;
                    // Save to Firestore
                    if (state.user) {
                        // Get current user data or create empty object
                        const currentData = state.userData || {};
                        firebaseDb.collection('users').doc(state.user.uid).set({
                            ...currentData,
                            photoURL: base64
                        }, { merge: true }).then(() => {
                            // Update state after successful save
                            state.userData = { ...currentData, photoURL: base64 };
                        }).catch(error => {
                            console.error('Error saving photo:', error);
                        });
                    }
                };
                reader.readAsDataURL(file);
            }
        });

        // Show help modal
        function showHelpModal() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-xl p-6 w-full max-w-lg">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-headline-sm text-headline-sm text-primary kannada-text">ಸಹಾಯ ಮತ್ತು ಬೆಂಬಲ</h3>
                        <button id="close-help-modal" class="text-2xl text-on-surface-variant">&times;</button>
                    </div>
                    <div class="space-y-4">
                        <div class="p-4 bg-surface-container-high rounded-lg">
                            <h4 class="font-bold text-primary mb-2 kannada-text">ಸಹಾಯ ಬೇಕೇ?</h4>
                            <p class="text-on-surface font-body-lg text-body-lg kannada-text">ದಯವಿಟ್ಟು ನಿಮಗೆ ಸಹಾಯ ಬೇಕಾದರೆ ಅಡ್ಮಿನ್ ಅವರನ್ನು ಸಂಪರ್ಕಿಸಿ:</p>
                            <ul class="list-disc list-inside text-on-surface font-body-lg text-body-lg mt-2 space-y-1 kannada-text">
                                <li>ಪ್ರೊಫೈಲ್ ಅಪ್ಡೇಟ್ ಸಮಸ್ಯೆಗಳು</li>
                                <li>ಇವೆಂಟ್ ನೇಮಣಿಸುವಿಕೆಗಳು</li>
                                <li>ಬಸ್ / ರೈಲು ಪಿಕಪ್ ಪಾಯಿಂಟ್ ಆಯ್ಕೆ</li>
                                <li>ತಾಂತ್ರಿಕ ಸಹಾಯ</li>
                            </ul>
                        </div>
                        <div id="admins-list" class="space-y-2">
                            <p class="text-center text-on-surface-variant kannada-text">ಅಡ್ಮಿನ್ಸ್ ಲೋಡ್ ಆಗುತ್ತಿದ್ದಾರೆ...</p>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('close-help-modal').addEventListener('click', () => {
                document.body.removeChild(modal);
            });
            
            // Fetch admin users from Firestore
            if (typeof firebaseDb !== 'undefined' && firebaseDb) {
                try {
                    firebaseDb.collection('users').where('role', '==', 'admin').onSnapshot(snapshot => {
                        const adminsList = document.getElementById('admins-list');
                        if (snapshot.empty) {
                            adminsList.innerHTML = '<p class="text-center text-on-surface-variant kannada-text">ಯಾವ ಅಡ್ಮಿನ್ ಲಭ್ಯವಿಲ್ಲ</p>';
                            return;
                        }
                        
                        let html = '<p class="font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ಅಡ್ಮಿನ್ ಸಂಪರ್ಕಿಸಿ:</p>';
                        snapshot.forEach(doc => {
                            const admin = doc.data();
                            const phone = admin.phone || admin.email || 'N/A';
                            const name = admin.name || 'Admin';
                            html += `
                                <div class="p-3 bg-primary-fixed rounded-lg flex justify-between items-center">
                                    <span class="font-body-lg text-body-lg text-on-primary-fixed kannada-text">${name}</span>
                                    <a href="tel:${phone}" class="text-primary font-bold text-body-lg kannada-text">${phone}</a>
                                </div>
                            `;
                        });
                        adminsList.innerHTML = html;
                    });
                } catch (error) {
                    document.getElementById('admins-list').innerHTML = '<p class="text-center text-on-surface-variant kannada-text">ಅಡ್ಮಿನ್ ಸಂಪರ್ಕವನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ</p>';
                }
            }
        }

        // Compress a payment screenshot in the browser, then convert it to base64 for upload.
        async function compressImageToBase64(file) {
            const readAsDataURL = (blob) => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(blob);
            });
            if (!file || !file.type || !file.type.startsWith('image/')) {
                throw new Error('Please attach a valid screenshot image (JPG or PNG).');
            }
            const dataUrl = await readAsDataURL(file);
            // Already small: pass through unchanged, no recompression artifacts.
            if (file.size <= 300 * 1024) return dataUrl;
            const image = await new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = () => reject(new Error('Could not read the screenshot. Please upload a JPG or PNG image.'));
                img.src = dataUrl;
            });
            const maxDimension = 1600;
            const width = image.naturalWidth || image.width || 1;
            const height = image.naturalHeight || image.height || 1;
            const scale = Math.min(1, maxDimension / Math.max(width, height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(width * scale));
            canvas.height = Math.max(1, Math.round(height * scale));
            const context = canvas.getContext('2d');
            context.fillStyle = '#ffffff';
            context.fillRect(0, 0, canvas.width, canvas.height);
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            // Step quality down until the payload stays safely under Firestore's 1MB doc limit.
            const maxBytes = 350 * 1024;
            let quality = 0.75;
            let output = canvas.toDataURL('image/jpeg', quality);
            while ((output.length * 0.75) > maxBytes && quality > 0.35) {
                quality -= 0.1;
                output = canvas.toDataURL('image/jpeg', quality);
            }
            return output;
        }

        // Show donation payment modal
        function showDonationModal() {
            const appName = window.donationConfig?.appName || window.paymentConfig?.appName || 'Rudra Balaga';
            const upiId = window.donationConfig?.upiId || window.paymentConfig?.upiId || 'YOUR_UPI_ID@bank';
            const bankTransfer = (window.donationConfig && window.donationConfig.bankTransfer) || {};
            const donationNote = window.donationConfig?.note || 'Thank you for your generous donation. Payment is non-refundable.';
            const donorName = (state.userData && state.userData.name) || state.user?.displayName || state.user?.email || '';
            const donorEmail = state.user?.email || '';
            const donorPhone = (state.userData && state.userData.phone) || '';
            const upiUrl = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(appName)}&am=${encodeURIComponent('0.00')}&cu=INR&tn=${encodeURIComponent(`DONATION_${state.user?.uid || 'anon'}_${Date.now()}`)}`;
            const bankTransferHtml = bankTransfer.accountNumber ? `
                        <div class="rounded-xl bg-surface-container-high border border-outline-variant overflow-hidden">
                            <button type="button" id="toggle-bank-details" class="w-full flex items-center justify-between gap-2 px-4 py-3 text-left">
                                <span class="flex items-center gap-2 font-label-lg text-label-lg text-primary"><span class="material-symbols-outlined">account_balance</span>Pay by bank transfer</span>
                                <span id="bank-details-chevron" class="material-symbols-outlined text-on-surface-variant transition-transform">expand_more</span>
                            </button>
                            <div id="bank-details-body" class="hidden px-4 pb-4 space-y-1 text-sm text-on-surface-variant">
                                <p>Bank: <strong class="text-on-surface">${bankTransfer.bankName || 'Not specified'}</strong></p>
                                <p>Account holder: <strong class="text-on-surface">${bankTransfer.accountName || 'Not specified'}</strong></p>
                                <p class="break-all">Account number: <strong class="text-on-surface select-all">${bankTransfer.accountNumber}</strong></p>
                                <p>IFSC: <strong class="text-on-surface select-all">${bankTransfer.ifscCode || 'Not specified'}</strong></p>
                            </div>
                        </div>` : '';
            const modal = document.createElement('div');
            modal.className = 'payment-modal-backdrop fixed inset-0 z-50 flex items-center justify-center';
            modal.innerHTML = `
                <div class="payment-modal bg-white w-full max-w-lg rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-full">
                    <div class="payment-modal-header flex items-start justify-between gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <span class="payment-method-icon material-symbols-outlined">volunteer_activism</span>
                            <div class="min-w-0">
                                <h3 class="font-headline-sm text-headline-sm text-primary leading-tight">Donation</h3>
                                <p class="text-sm text-on-surface-variant truncate">Rudra Balaga • ಧರ್ಮಾರ್ಥ ದೇಣಿಗೆ</p>
                            </div>
                        </div>
                        <button id="close-payment-modal" aria-label="Close" class="shrink-0 w-9 h-9 rounded-full bg-surface-container-high text-on-surface-variant flex items-center justify-center text-xl leading-none">&times;</button>
                    </div>
                    <div class="payment-modal-body space-y-3 sm:space-y-4">
                        <div class="rounded-xl bg-secondary-fixed border border-secondary-container p-4">
                            <label for="donation-amount" class="font-label-md text-label-md text-secondary uppercase tracking-wider">Your donation amount (₹)</label>
                            <input id="donation-amount" type="number" min="1" step="1" inputmode="numeric" required class="w-full h-14 mt-1 px-4 rounded-xl border-2 border-primary-container bg-white text-2xl font-bold text-primary" placeholder="Enter amount">
                            <p class="text-on-surface-variant text-sm mt-2 kannada-text">${donationNote}</p>
                        </div>
                        ${bankTransferHtml}
                        <div class="payment-disclaimer p-3 text-sm">
                            <span class="material-symbols-outlined shrink-0" style="font-size:18px;">info</span>
                            <p>Please enter the exact amount you paid so we can verify your donation.</p>
                        </div>
                        <div>
                            <p class="payment-step-label font-label-lg text-label-lg text-on-surface mb-2"><span class="payment-step-num">1</span>Choose a payment method</p>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                <button type="button" id="cancel-payment-modal" class="touch-active w-full h-14 rounded-xl bg-surface-container-high text-on-surface-variant font-bold flex items-center justify-center gap-2">
                                    <span class="material-symbols-outlined">arrow_back</span>No, go back
                                </button>
                                <a href="${upiUrl}" id="donation-upi-link" class="touch-active w-full h-14 rounded-xl bg-primary-container text-on-primary-container font-bold flex items-center justify-center gap-2">
                                    <span class="material-symbols-outlined">account_balance_wallet</span>Pay via GPay / UPI
                                </a>
                            </div>
                        </div>
                        <form id="payment-proof-form" class="space-y-3 pt-4 border-t border-outline-variant">
                            <p class="payment-step-label font-label-lg text-label-lg text-on-surface"><span class="payment-step-num">2</span>Submit your payment proof</p>
                            <div>
                                <label for="payment-screenshot" class="block font-label-md text-label-md text-on-surface mb-1.5">Transaction screenshot <span class="text-error">*</span></label>
                                <input id="payment-screenshot" type="file" accept="image/*" required class="w-full px-3 py-2.5 rounded-xl border border-outline-variant text-on-surface bg-white">
                            </div>
                            <div>
                                <label for="payment-utr" class="block font-label-md text-label-md text-on-surface mb-1.5">UTR / Transaction reference</label>
                                <input id="payment-utr" type="text" inputmode="numeric" class="w-full h-12 px-3 rounded-xl border border-outline-variant text-on-surface bg-white" placeholder="Recommended">
                            </div>
                            <button type="submit" class="touch-active w-full h-14 rounded-xl bg-secondary-container text-on-secondary-container font-bold flex items-center justify-center gap-2">
                                <span class="material-symbols-outlined">upload_file</span>Submit donation proof
                            </button>
                            <p id="payment-upload-status" class="text-sm text-on-surface-variant"></p>
                        </form>
                    </div>
                </div>`;
            document.body.appendChild(modal);
            const upiLink = document.getElementById('donation-upi-link');
            const amountInput = document.getElementById('donation-amount');
            function updateUpiUrl() {
                const amt = Number(amountInput.value || 0).toFixed(2);
                upiLink.href = `upi://pay?pa=${encodeURIComponent(upiId)}&pn=${encodeURIComponent(appName)}&am=${encodeURIComponent(amt)}&cu=INR&tn=${encodeURIComponent(`DONATION_${state.user?.uid || 'anon'}_${Date.now()}`)}`;
            }
            amountInput.addEventListener('input', updateUpiUrl);
            // Close when tapping the backdrop
            modal.addEventListener('click', (clickEvent) => {
                if (clickEvent.target === modal) modal.remove();
            });
            // Toggle collapsible bank details
            const toggleBankBtn = document.getElementById('toggle-bank-details');
            if (toggleBankBtn) {
                toggleBankBtn.onclick = () => {
                    document.getElementById('bank-details-body')?.classList.toggle('hidden');
                    const chevron = document.getElementById('bank-details-chevron');
                    if (chevron) chevron.style.transform = chevron.style.transform === 'rotate(180deg)' ? '' : 'rotate(180deg)';
                };
            }
            document.getElementById('close-payment-modal').onclick = () => modal.remove();
            document.getElementById('cancel-payment-modal').onclick = () => modal.remove();
            document.getElementById('payment-proof-form').addEventListener('submit', async (submitEvent) => {
                submitEvent.preventDefault();
                const amount = Number(amountInput.value);
                const uploadStatus = document.getElementById('payment-upload-status');
                if (!amount || amount <= 0) {
                    uploadStatus.textContent = 'Please enter a valid donation amount.';
                    uploadStatus.style.color = '#b00020';
                    return;
                }
                const file = document.getElementById('payment-screenshot').files[0];
                uploadStatus.textContent = 'Compressing & uploading donation proof...';
                uploadStatus.style.color = '';
                try {
                    if (!file) throw new Error('Payment screenshot is required.');
                    const screenshotBase64 = await compressImageToBase64(file);
                    const donationRecord = {
                        uid: state.user?.uid || '',
                        name: donorName,
                        email: donorEmail,
                        phone: donorPhone,
                        amount,
                        paymentStatus: 'PENDING_APPROVAL',
                        screenshotBase64,
                        utrNumber: document.getElementById('payment-utr').value.trim(),
                        submittedAt: firebase.firestore.FieldValue.serverTimestamp()
                    };
                    await firebaseDb.collection('donations').add(donationRecord);
                    modal.remove();
                    const toast = document.createElement('div');
                    toast.className = 'fixed top-20 left-0 right-0 mx-auto z-50 bg-secondary-container text-on-secondary-container px-6 py-4 rounded-xl shadow-lg max-w-sm';
                    toast.innerHTML = '<div class="flex items-center justify-center gap-3"><span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">volunteer_activism</span><span>Thank you for your donation! Proof submitted for approval.</span></div>';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 3500);
                } catch (error) {
                    console.error('Donation proof upload failed:', error);
                    uploadStatus.textContent = 'Upload failed. Please try again.';
                }
            });
        }

    // Setup logout button
    document.getElementById('logout-btn').addEventListener('click', function() {
        // Clear demo mode data
        localStorage.removeItem('userPhone');
        localStorage.removeItem('userPin');
        
        // Sign out from Firebase
        if (typeof firebaseAuth !== 'undefined' && firebaseAuth) {
            firebaseAuth.signOut().then(() => {
                window.location.href = 'login.html';
            }).catch(() => {
                window.location.href = 'login.html';
            });
        } else {
            window.location.href = 'login.html';
        }
    });

    // Setup help button
    document.getElementById('help-btn').addEventListener('click', showHelpModal);

    // Setup donate button
    document.getElementById('donate-btn').addEventListener('click', showDonationModal);
    </script>
</body>
