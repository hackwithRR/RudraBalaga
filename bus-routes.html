    <script>
        // State Management
        const state = {
            events: [],
            rsvps: {},
            busRoutes: {},
            user: null
        };

        // Initialize app
        document.addEventListener('DOMContentLoaded', () => {
            // Check authentication state
            firebaseAuth.onAuthStateChanged(user => {
                if (user) {
                    state.user = user;
                    // Real-time notification center (bell + badge + panel + toasts)
                    if (window.Notifications) { try { Notifications.init({ uid: user.uid }); } catch (e) {} }
                    loadUserData(user);
                    loadEvents();
                    loadRsvps();
                    loadBusRoutes();
                } else {
                    // No user - redirect to login
                    window.location.href = 'login';
                }
            });
        });

        // Load user data
        function loadUserData(user) {
            // Set Google data as fallback
            document.getElementById('user-name').textContent = user.displayName || user.email || 'ಭಕ್ತ';
            if (user.photoURL) {
                document.getElementById('profile-link').innerHTML = `<img src="${user.photoURL}" class="w-full h-full rounded-full object-cover" alt="Profile">`;
            }
            
            // Listen to user data from Firestore in real-time
            if (typeof firebaseDb !== 'undefined' && firebaseDb) {
                try {
                    firebaseDb.collection('users').doc(user.uid).onSnapshot(doc => {
                        if (doc.exists) {
                            const userData = doc.data();
                            // Update user name in header
                            document.getElementById('user-name').textContent = userData.name || user.displayName || user.email || 'ಭಕ್ತ';
                            // Show user ID
                            if (userData.userId) {
                                document.getElementById('user-id').textContent = `ಐಡಿ: ${userData.userId}`;
                                document.getElementById('user-id').classList.remove('hidden');
                            }
                            // Show profile picture in header
                            if (userData.photoURL) {
                                document.getElementById('profile-link').innerHTML = `<img src="${userData.photoURL}" class="w-full h-full rounded-full object-cover" alt="Profile">`;
                            }
                        }
                    });
                } catch (error) {
                    console.log('Firestore not available, using Google data');
                }
            }
        }

        // Load events from Firestore
        function loadEvents() {
            try {
                firebaseDb.collection('events').orderBy('date', 'desc').onSnapshot(snapshot => {
                    state.events = [];
                    snapshot.forEach(doc => {
                        state.events.push({ id: doc.id, ...doc.data() });
                    });
                    renderOutstationEvents();
                    // "Day before" / same-day reminders as soon as events load or change
                    if (window.Notifications && state.user) { try { Notifications.checkEventReminders(state.events); } catch (e) {} }
                });
            } catch (error) {
                console.log('Firestore not available, using demo data');
                // Demo data
                state.events = [
                    { id: 'demo-event-1', title: 'ರುದ್ರ ಅಭಿಷೇಕಂ', date: '2026-07-15', time: '06:00', type: 'Outstation', location: 'ISKCON ದೇವಸ್ಥಾನ, ಬೆಂಗಳೂರು' }
                ];
                renderOutstationEvents();
                if (window.Notifications && state.user) { try { Notifications.checkEventReminders(state.events); } catch (e) {} }
            }
        }

        // Load RSVPs from Firestore
        function loadRsvps() {
            if (!state.user) return;
            
            try {
                firebaseDb.collection('rsvps').doc(state.user.uid).onSnapshot(doc => {
                    state.rsvps = doc.exists ? { [state.user.uid]: doc.data() } : {};
                    renderOutstationEvents();
                });
            } catch (error) {
                console.log('Firestore not available, using demo data');
                state.rsvps = {};
            }
        }

        // Load bus routes from Firestore
        function loadBusRoutes() {
            try {
                firebaseDb.collection('busRoutes').onSnapshot(snapshot => {
                    state.busRoutes = {};
                    snapshot.forEach(doc => {
                        state.busRoutes[doc.id] = doc.data().buses || [];
                    });
                    renderOutstationEvents();
                });
            } catch (error) {
                console.log('Firestore not available, using demo data');
                state.busRoutes = {};
            }
        }

        // Render outstation events on bus routes page
        function renderOutstationEvents() {
            const outstationEventsList = document.getElementById('outstation-events-list');
            
            // Filter only outstation events
            const outstationEvents = state.events.filter(e => e.type === 'Outstation');
            
            if (outstationEvents.length === 0) {
                outstationEventsList.innerHTML = '<p class="text-on-surface-variant kannada-text">ಹೊರಊರಿನ ಕಾರ್ಯಕ್ರಮ ಕಂಡುಹಿದ್ದಲ್ಲಿಲ್ಲ.</p>';
                return;
            }

            outstationEventsList.innerHTML = outstationEvents.map(e => {
                const userRsvp = state.rsvps[state.user.uid] && state.rsvps[state.user.uid][e.id];
                const isAttending = userRsvp && userRsvp.status === 'attending';
                
                // Get bus routes for this event
                const buses = state.busRoutes[e.id] || [];
                const allRoutes = [];
                buses.forEach(bus => {
                    if (bus.routes) {
                        bus.routes.forEach(route => {
                            allRoutes.push({ ...route, busName: bus.name, busNumber: bus.number || '', driverNumber: bus.driverNumber || '' });
                        });
                    }
                });
                
                // Sort routes by time
                allRoutes.sort((a, b) => {
                    const timeA = a.time || '';
                    const timeB = b.time || '';
                    return timeA.localeCompare(timeB);
                });
                
                // Check if user has selected a pickup point
                const hasSelectedPickup = userRsvp && userRsvp.pickupPoint;
                
                // Build routes HTML
                let routesHtml = '';
                if (allRoutes.length > 0 && isAttending) {
                    // Group routes by bus name
                    const routesByBus = {};
                    allRoutes.forEach(route => {
                        if (!routesByBus[route.busName]) {
                            routesByBus[route.busName] = [];
                        }
                        routesByBus[route.busName].push(route);
                    });
                    
                    routesHtml = `
                        <div class="mt-3 pt-3 border-t border-outline-variant">
                            <div class="flex justify-between items-center mb-2">
                                <p class="font-label-lg text-label-lg text-on-surface-variant kannada-text">ಬಸ್ / ರೈಲು ಪಿಕಪ್ ಪಾಯಿಂಟ್ಸ್:</p>
                                ${hasSelectedPickup ? `<button type="button" class="edit-pickup-btn touch-active group inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-full bg-secondary-container text-on-secondary-container shadow-sm hover:bg-secondary hover:text-on-secondary transition-colors duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary focus-visible:ring-offset-2 focus-visible:ring-offset-surface-container-lowest" data-event-id="${e.id}" aria-label="ಪಿಕಪ್ ಪಾಯಿಂಟ್ ಬದಲಿಸಿ"><span class="material-symbols-outlined text-lg transition-transform duration-300 group-hover:scale-110" style="font-variation-settings: 'FILL' 1;" data-icon="swap_horiz">swap_horiz</span><span class="font-label-md text-label-md kannada-text whitespace-nowrap">ಬದಲಿಸಿ</span></button>` : ''}
                            </div>
                            ${hasSelectedPickup ? `
                                <div class="mb-3">
                                    <p class="font-body-lg text-body-lg text-primary font-bold mb-2 kannada-text">ನಿಮ್ಮ ಆಯ್ಕೆ ಮಾಡಿದ ಪಿಕಪ್ ಪಾಯಿಂಟ್:</p>
                                    ${(() => {
                                        const myPickup = allRoutes.find(r => r.id === userRsvp.pickupPoint);
                                        const pickupPointText = myPickup?.point || 'ತಿದ್ದುಪಡೆಯಲಿಲ್ಲ';
                                        const pickupMetaText = `${myPickup?.time || ''} (${myPickup?.busName || ''})`;
                                        const pickupBusNumber = myPickup?.busNumber || 'ಘೋಷಿಸಲಾಗುವುದು';
                                        const pickupDriverHtml = myPickup?.driverNumber
                                            ? `<a href="tel:${myPickup.driverNumber.replace(/[^+0-9]/g, '')}" class="font-bold text-primary underline kannada-text">${myPickup.driverNumber}</a>`
                                            : '<span class="kannada-text">ಘೋಷಿಸಲಾಗುವುದು</span>';
                                        return `
                                            <div class="p-3 rounded-lg border-2 border-primary-container bg-primary-fixed-dim">
                                                <p class="font-body-lg text-body-lg text-on-surface kannada-text">${pickupPointText}</p>
                                                <p class="font-label-md text-label-md text-on-surface-variant">${pickupMetaText}</p>
                                                <div class="mt-2 pt-2 border-t border-outline-variant">
                                                    <p class="font-label-md text-label-md text-on-surface-variant kannada-text"><span class="material-symbols-outlined text-secondary" style="font-size:16px;vertical-align:middle;">directions_bus</span> ಬಸ್ / ರೈಲು ಸಂಖ್ಯೆ: <span class="font-bold text-on-surface">${pickupBusNumber}</span></p>
                                                    <p class="font-label-md text-label-md text-on-surface-variant kannada-text mt-1"><span class="material-symbols-outlined text-secondary" style="font-size:16px;vertical-align:middle;">call</span> ಡ್ರೈವರ್ ದೂರವಾಣಿ: ${pickupDriverHtml}</p>
                                                </div>
                                            </div>
                                        `;
                                    })()}
                                </div>
                            ` : `
                                ${Object.entries(routesByBus).map(([busName, routes]) => `
                                    <div class="mb-3">
                                        <p class="font-body-lg text-body-lg text-primary font-bold mb-2 kannada-text">${busName}</p>
                                        <div class="space-y-2" data-event-id="${e.id}">
                                            ${routes.map(route => `
                                                <label class="flex items-center gap-3 p-3 rounded-lg border-2 ${userRsvp && userRsvp.pickupPoint === route.id ? 'border-primary-container bg-primary-fixed-dim' : 'border-outline-variant bg-surface-container-lowest'} ${hasSelectedPickup ? 'opacity-70 cursor-not-allowed' : 'cursor-pointer'}">
                                                    <input type="radio" name="pickup-${e.id}" value="${route.id}" data-event-id="${e.id}" data-pickup-point="${route.id}" class="bus-pickup-radio w-5 h-5 text-primary-container" ${userRsvp && userRsvp.pickupPoint === route.id ? 'checked' : ''} ${hasSelectedPickup ? 'disabled' : ''}>
                                                    <div class="flex-1">
                                                        <p class="font-body-lg text-body-lg text-on-surface kannada-text">${route.point}</p>
                                                        <p class="font-label-md text-label-md text-on-surface-variant">${route.time}</p>
                                                    </div>
                                                </label>
                                            `).join('')}
                                        </div>
                                    </div>
                                `).join('')}
                            `}
                        </div>
                    `;
                }
                
                return `
                    <div class="bg-surface-container-lowest border-2 border-primary-container rounded-xl p-6 shadow-sm" data-event-id="${e.id}">
                        <h4 class="font-bold text-primary text-lg mb-2 kannada-text">${e.title}</h4>
                        <p class="text-on-surface font-body-lg text-body-lg kannada-text">${formatDate(e.date)} ರಂದು ${e.time} ಗಂಟೆಗೆ</p>
                        <p class="text-on-surface-variant font-body-lg text-body-lg kannada-text">${e.location}</p>
                        ${routesHtml}
                    </div>
                `;
            }).join('');

            // Add event listeners for bus pickup radio buttons
            document.querySelectorAll('.bus-pickup-radio').forEach(radio => {
                radio.addEventListener('change', function() {
                    const eventId = this.getAttribute('data-event-id');
                    const pickupPoint = this.value;
                    updatePickupPoint(eventId, pickupPoint);
                });
            });
            
            // Add event listeners for edit pickup buttons
            document.querySelectorAll('.edit-pickup-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const eventId = this.getAttribute('data-event-id');
                    // Remove the pickup point to allow re-selection
                    if (state.rsvps[state.user.uid] && state.rsvps[state.user.uid][eventId]) {
                        delete state.rsvps[state.user.uid][eventId].pickupPoint;
                    }
                    // Re-render to show the radio buttons
                    renderOutstationEvents();
                });
            });
        }
        
        // Update pickup point
        function updatePickupPoint(eventId, pickupPoint) {
            if (!state.user) return;
            
            const rsvpData = {
                ...state.rsvps[state.user.uid]?.[eventId],
                pickupPoint: pickupPoint
            };
            
            firebaseDb.collection('rsvps').doc(state.user.uid).set({
                [eventId]: rsvpData
            }, { merge: true });
        }

        // Show help modal
        function showHelpModal() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-xl p-6 w-full max-w-lg">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-headline-sm text-headline-sm text-primary kannada-text">ಸಹಾಯ ಮತ್ತು ಬೆಂಬಲ</h3>
                        <button id="close-help-modal" class="text-2xl text-on-surface-variant">&times;</button>
                    </div>
                    <div class="space-y-4">
                        <div class="p-4 bg-surface-container-high rounded-lg">
                            <h4 class="font-bold text-primary mb-2 kannada-text">ಸಹಾಯ ಬೇಕೇ?</h4>
                            <p class="text-on-surface font-body-lg text-body-lg kannada-text">ದಯವಿಟ್ಟು ನಿಮಗೆ ಸಹಾಯ ಬೇಕಾದರೆ ಅಡ್ಮಿನ್ ಅವರನ್ನು ಸಂಪರ್ಕಿಸಿ:</p>
                            <ul class="list-disc list-inside text-on-surface font-body-lg text-body-lg mt-2 space-y-1 kannada-text">
                                <li>ಇವೆಂಟ್ </li>
                                <li>ಬಸ್ / ರೈಲು ಪಿಕಪ್ ಪಾಯಿಂಟ್ ಆಯ್ಕೆ</li>
                                <li>ಖಾತೆ ಅಥವಾ ಪ್ರೊಫೈಲ್ ಸಮಸ್ಯೆಗಳು</li>
                                <li>ತಾಂತ್ರಿಕ ಸಹಾಯ</li>
                            </ul>
                        </div>
                        <div id="admins-list" class="space-y-2">
                            <p class="text-center text-on-surface-variant kannada-text">ಅಡ್ಮಿನ್ಸ್ ಲೋಡ್ ಆಗುತ್ತಿದ್ದಾರೆ...</p>
                        </div>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
            document.getElementById('close-help-modal').addEventListener('click', () => {
                document.body.removeChild(modal);
            });
            
            // Fetch admin users from Firestore
            if (typeof firebaseDb !== 'undefined' && firebaseDb) {
                try {
                    firebaseDb.collection('users').where('role', '==', 'admin').onSnapshot(snapshot => {
                        const adminsList = document.getElementById('admins-list');
                        if (snapshot.empty) {
                            adminsList.innerHTML = '<p class="text-center text-on-surface-variant kannada-text">ಯಾವ ಅಡ್ಮಿನ್ ಲಭ್ಯವಿಲ್ಲ</p>';
                            return;
                        }
                        
                        let html = '<p class="font-label-lg text-label-lg text-on-surface mb-2 kannada-text">ಅಡ್ಮಿನ್ ಸಂಪರ್ಕಿಸಿ:</p>';
                        snapshot.forEach(doc => {
                            const admin = doc.data();
                            const phone = admin.phone || admin.email || 'N/A';
                            const name = admin.name || 'ಅಡ್ಮಿನ್';
                            html += `
                                <div class="p-3 bg-primary-fixed rounded-lg flex justify-between items-center">
                                    <span class="font-body-lg text-body-lg text-on-primary-fixed kannada-text">${name}</span>
                                    <a href="tel:${phone}" class="text-primary font-bold text-body-lg kannada-text">${phone}</a>
                                </div>
                            `;
                        });
                        adminsList.innerHTML = html;
                    });
                } catch (error) {
                    document.getElementById('admins-list').innerHTML = '<p class="text-center text-on-surface-variant kannada-text">ಅಡ್ಮಿನ್ ಸಂಪರ್ಕವನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಿಲ್ಲ</p>';
                }
            }
        }
        
        // Add help button click handler
        document.getElementById('help-btn').addEventListener('click', showHelpModal);

        // Format date for display
        function formatDate(dateString) {
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('kn-IN', options);
        }
    </script>
</body>
